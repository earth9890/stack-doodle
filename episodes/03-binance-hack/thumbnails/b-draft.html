<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Caveat"; src: url("../assets/fonts/Caveat.ttf") format("truetype"); font-weight: 400 700; }
      @font-face { font-family: "PH"; src: url("../assets/fonts/Mali-SemiBold.ttf") format("truetype"); }
      @font-face { font-family: "Mali"; src: url("../assets/fonts/Mali-SemiBold.ttf") format("truetype"); }
      @font-face { font-family: "Mono"; src: url("../assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }
      @font-face { font-family: "Fredoka"; src: url("../assets/fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; font-stretch: 75% 125%; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fdfcf8; }
      #root { position: relative; width: 100%; height: 100%; background: #fdfcf8; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cap { position: absolute; left: 0; right: 0; bottom: 16px; height: 84px; display: flex; justify-content: center; align-items: center; gap: 16px;
             font-family: "PH", sans-serif; font-size: 56px; color: #ffffff; -webkit-text-stroke: 10px #1d1b1f; paint-order: stroke fill; opacity: 0; white-space: nowrap; }
      .cap span { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.0" data-width="1920" data-height="1080">
      <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="marker" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
          </filter>
        </defs>
        <g id="board" filter="url(#marker)"></g>
      </svg>
      <div id="caps"></div>
      
    </div>
    <script>
      const THEME = "light";
      const THUMB = true;
      const LOOK = "still";
      const MOTION = "v1";
      const TIMING = {"total": 1.0, "words": [], "chunks": [], "clips": []};
      window.__timelines = window.__timelines || {};
// =====================================================================================
// whiteboard-video-studio ENGINE v2 — hand-drawn whiteboard / chalkboard toolkit (HyperFrames + GSAP)
// Globals required BEFORE this file (build.py injects them): THEME ("light"|"dark"), TIMING (words.json).
// Full API + examples: references/engine-api.md. Every time argument is ABSOLUTE seconds.
// =====================================================================================
const NS = "http://www.w3.org/2000/svg";
const DARK = THEME === "dark";
// look v3 (`// look: v3` in scenes.js): bold 12 px outline, saturated flat fills, filled-head characters, scenery via S.bg()
const STORY = typeof LOOK !== "undefined" && LOOK === "story"; // long-form explainer: v3 drawing + hard cuts, no captions
const STILL = typeof LOOK !== "undefined" && LOOK === "still"; // illustrated stills: crisp vector, no draw-on, progressive build + slow camera (references/style-guide.md)
const V3 = typeof LOOK !== "undefined" && (LOOK === "v3" || STORY || STILL);
const PAPER = V3 ? "#ffffff" : DARK ? "#25272a" : "#fdfcf8";
const INK = V3 ? "#1d1b1f" : DARK ? "#f1efe8" : "#161616";
const RED = V3 ? "#e5383b" : DARK ? "#ff6b5e" : "#e0312b";
const GREEN = V3 ? "#3aa655" : DARK ? "#62d377" : "#2f9e44";
const ORANGE = V3 ? "#ff8c1a" : "#ff8a2a";
const YEL = V3 ? "#ffcf33" : "#ffd23f";
const BLUE = V3 ? "#2f6fd6" : DARK ? "#86b6ff" : "#3d6fb6";
const GRAY = V3 ? "#9aa0a6" : DARK ? "#8d9095" : "#a2a2a2";
const LEAF = V3 ? "#7cc576" : DARK ? "#5f9e68" : "#a8dca8";
const SKY = V3 ? "#9ad4f5" : DARK ? "#36475f" : "#d9ecff";
const PINK = V3 ? "#ffb3c1" : DARK ? "#7b4a55" : "#ffd9df";
const CREAM = V3 ? "#f6d7a7" : DARK ? "#3a3933" : "#fff6e3";
const GLOW = V3 ? "#ffe066" : DARK ? "#fff2b0" : "#ffe9a8";
const GY = 860; // ground line (captions live below ~980)
const TK = (typeof THUMB !== "undefined" && THUMB) ? 1.55 : 1; // thumbnails: thicker marker so lines survive 160 px
const SW = TK * (STILL ? 1 : V3 ? 1.3 : 1); // v3: default 7 → ~9 px; stills: widths are exact px (DS.w tokens)

const THUMB_BOLD = TK > 1; // thumbnails: all text bold by default
const tl = gsap.timeline({ paused: true });
const board = document.getElementById("board");
const defs = document.querySelector("#stage defs");
const TOTAL = TIMING.total;

// ---------- timing ----------
const WORD = (c, i) => {
  const w = TIMING.words.find((x) => x[0] === c && x[1] === i);
  if (!w) throw new Error("no word " + c + ":" + i);
  return w;
};
// `// motion: v2` (opt-in, references/engine-api.md "Motion v2"): pictures lead their word by LEAD (a 0.35 s fade is half-in ~1 f before the
// word), stronger hold push, blinks on library faces, S.kick / S.punch, entrance events for sound.py. Captions stay on the audio.
const MOTION2 = typeof MOTION !== "undefined" && MOTION === "v2";
const LEAD = MOTION2 ? 0.15 : 0;
const EVENTS = (window.__EVENTS = window.__EVENTS || []); // [t, kind, x] for sound.py (pop / slide / kick / punch / sfx:<name>)
const ev = (t, kind, x = 960) => EVENTS.push([+(+t).toFixed(3), kind, Math.round(x)]);
const W = (c, i) => Math.max(0, WORD(c, i)[3] - LEAD); // word start (clip is 1-based, word index 0-based)
const WE = (c, i) => Math.max(0, WORD(c, i)[4] - LEAD); // word end
const CLIP = (c) => (LEAD ? TIMING.clips[c - 1].map((v) => Math.max(0, v - LEAD)) : TIMING.clips[c - 1]); // [start, end] of a spoken sentence
// cues: [[clip, wordIdx], ...] — first cue is the opening scene (starts at 0, animation lead-in)
function sceneWindows(cues, lead = 0.4) {
  const st = cues.map((q, k) => (k === 0 ? 0 : +(W(q[0], q[1]) - lead).toFixed(3)));
  return st.map((s, k) => [s, k + 1 < st.length ? st[k + 1] : TOTAL]);
}

// ---------- deterministic hand-drawn path helpers ----------
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647), (seed - 1) / 2147483646);
const J = (a) => (STILL ? (rnd(), 0) : (rnd() - 0.5) * a); // hand wobble (off for crisp stills; rnd() still consumed so seeds stay stable)
const f1 = (n) => n.toFixed(1);
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
const poly = (pts, jit = 3) => pts.map((p, i) => `${i ? "L" : "M"}${f1(p[0] + J(jit))} ${f1(p[1] + J(jit))}`).join(" ");
const line = (a, b, bow = 8) => {
  const mx = (a[0] + b[0]) / 2 + J(bow), my = (a[1] + b[1]) / 2 + J(bow);
  return `M${f1(a[0] + J(3))} ${f1(a[1] + J(3))} Q${f1(mx)} ${f1(my)} ${f1(b[0] + J(3))} ${f1(b[1] + J(3))}`;
};
const smooth = (pts) => {
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d;
};
const circ = (cx, cy, r, ry = r) => {
  if (STILL) { rnd(); return `M${f1(cx - r)} ${f1(cy)} A${f1(r)} ${f1(ry)} 0 1 0 ${f1(cx + r)} ${f1(cy)} A${f1(r)} ${f1(ry)} 0 1 0 ${f1(cx - r)} ${f1(cy)} Z`; } // exact ellipse
  const n = 16, a0 = rnd() * 6.28, pts = [];
  for (let i = 0; i <= n + 1; i++) {
    const a = a0 + (i / n) * Math.PI * 2 * 1.03, k = 1 + (rnd() - 0.5) * 0.05;
    pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * ry * k]);
  }
  return smooth(pts);
};
const rect = (x, y, w, h) => STILL ? `M${f1(x)} ${f1(y)} H${f1(x + w)} V${f1(y + h)} H${f1(x)} Z` : poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x - 3, y - 2]], 2.5);
const rrect = (x, y, w, h, r) => {
  if (STILL) { r = Math.min(r, w / 2, h / 2); return `M${f1(x + r)} ${f1(y)} H${f1(x + w - r)} A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + w)} ${f1(y + r)} V${f1(y + h - r)} A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + w - r)} ${f1(y + h)} H${f1(x + r)} A${f1(r)} ${f1(r)} 0 0 1 ${f1(x)} ${f1(y + h - r)} V${f1(y + r)} A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + r)} ${f1(y)} Z`; }
  const j = () => J(1.5);
  return `M${f1(x + r)} ${f1(y + j())} L${f1(x + w - r)} ${f1(y + j())} Q${f1(x + w)} ${f1(y)} ${f1(x + w + j())} ${f1(y + r)} L${f1(x + w + j())} ${f1(y + h - r)} Q${f1(x + w)} ${f1(y + h)} ${f1(x + w - r)} ${f1(y + h + j())} L${f1(x + r)} ${f1(y + h + j())} Q${f1(x)} ${f1(y + h)} ${f1(x + j())} ${f1(y + h - r)} L${f1(x + j())} ${f1(y + r)} Q${f1(x)} ${f1(y)} ${f1(x + r + 4)} ${f1(y - 1)}`;
};
const arcPts = (cx, cy, r, a0, a1, n = 18, ry = r) => {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = ((a0 + (i / n) * (a1 - a0)) * Math.PI) / 180; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * ry]); }
  return pts;
};
const arc = (cx, cy, r, a0, a1, ry = r) => smooth(arcPts(cx, cy, r, a0, a1, 18, ry));
const rays = (cx, cy, r1, r2, n, a0 = 0, span = Math.PI * 2) => {
  let d = "";
  for (let i = 0; i < n; i++) {
    const a = a0 + (i / Math.max(1, n - (span < 6 ? 1 : 0))) * span;
    d += `M${f1(cx + Math.cos(a) * r1)} ${f1(cy + Math.sin(a) * r1)} L${f1(cx + Math.cos(a) * r2)} ${f1(cy + Math.sin(a) * r2)} `;
  }
  return d;
};
// full heart, ~64*s wide, centred
const heartPath = (cx, cy, s = 1) => {
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const t = Math.PI + (i / 30) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3), y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    pts.push([cx + x * 2 * s, cy + (y + 2) * 2 * s]);
  }
  return smooth(pts);
};
// leaf-shaped heart whose tip sits at (cx,cy), rotated by ang (radians) — clover leaves
const leafHeart = (cx, cy, k, ang) => {
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const t = Math.PI + (i / 28) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3) * k;
    const y = (-(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 17) * k;
    const c = Math.cos(ang), s = Math.sin(ang);
    pts.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return smooth(pts);
};
const arrowHead = (x, y, ang, len = 22) => {
  const a1 = ang + Math.PI * 0.82, a2 = ang - Math.PI * 0.82;
  return `M${f1(x + Math.cos(a1) * len)} ${f1(y + Math.sin(a1) * len)} L${f1(x)} ${f1(y)} L${f1(x + Math.cos(a2) * len)} ${f1(y + Math.sin(a2) * len)}`;
};

// scale-in with overshoot around a fixed point (attr transform: stays put however the timeline is seeked)
const popAt = (e, t, cx, cy, dur = 0.35) => {
  const tf = (k) => `translate(${f1(cx)} ${f1(cy)}) scale(${k}) translate(${f1(-cx)} ${f1(-cy)})`;
  if (STILL) return tl.fromTo(e, { opacity: 0, attr: { transform: tf(0.92) } }, { opacity: 1, attr: { transform: tf(1) }, duration: 0.35, ease: "power2.out" }, t); // calm build, no bounce
  tl.fromTo(e, { opacity: 0, attr: { transform: tf(0.45) } }, { opacity: 1, attr: { transform: tf(1) }, duration: dur, ease: "back.out(2.2)" }, t);
};

// ---------- scenes ----------
let CLIPN = 0;
function scene(start, end, o = {}) {
  const g0 = el("g", {}, board), g = el("g", {}, g0); // g0: fade + default camera; g: content + S.zoom/S.pan (separate layers never fight)
  const S = { g, start, end, len: end - start };
  (window.__SCENES = window.__SCENES || []).push([start, end, g0]); // scene_gaps.py checks the timeline has no uncovered (blank) stretch
  if (STORY) { // hard cut on the breath (references: 100 % hard cuts)
    if (start > 0.001) tl.fromTo(g0, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, start);
    if (end < TOTAL - 0.05) tl.set(g0, { opacity: 0 }, end);
  } else if (STILL) { // slow 0.6 s crossfade between finished pictures
    if (start > 0.001) ev(start - 0.3, "scene"); // crossfade midpoint (sound.py --extra scene)
    if (start > 0.001) tl.fromTo(g0, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "none" }, start - 0.6);
    if (end < TOTAL - 0.05) tl.set(g0, { opacity: 0 }, end);
  } else if (V3) { // crossfade over the previous scene (fading both to paper flashes white between coloured backgrounds)
    if (start > 0.001) tl.fromTo(g0, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, start - 0.3);
    if (end < TOTAL - 0.05) tl.set(g0, { opacity: 0 }, end);
  } else {
    if (start > 0.001) tl.fromTo(g0, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, start);
    if (end < TOTAL - 0.05) tl.to(g0, { opacity: 0, duration: 0.25, ease: "none" }, end - 0.25);
  }
  const cam = o.cam === undefined ? (STORY ? "none" : "push") : o.cam; // push | pull | zoom | none
  const sc = (MOTION2 ? { push: [1, 1.06], pull: [1.07, 1], zoom: [1, 1.12] } : STILL ? { push: [1, 1.03], pull: [1.05, 1], zoom: [1, 1.08] } : { push: [1, 1.04], pull: [1.07, 1], zoom: [1, 1.12] })[cam]; // stills: slower drift; motion v2: every hold creeps ~0.05 %/f (the eye reads a still as frozen)
  if (sc) tl.fromTo(g0, { scale: sc[0] }, { scale: sc[1], svgOrigin: o.focus || "960 540", duration: S.len + (MOTION2 && start > 0.001 ? 0.6 : 0), ease: "none" }, MOTION2 && start > 0.001 ? start - 0.6 : start); // v2: creep already during the crossfade-in
  // camera moves on the content layer; a fixed-point attr transform (GSAP svgOrigin drifts when seeking backwards)
  const zt = (x, y, k, dx = 0, dy = 0) => `translate(${f1(x + dx)} ${f1(y + dy)}) scale(${k}) translate(${f1(-x)} ${f1(-y)})`;
  let camNow = [960, 540, 1, 0, 0];
  const camTo = (c, t, dur, ease, kind = "glide") => { if (kind && dur >= 0.3) ev(kind === "glide" ? t + dur / 2 : t, kind, c[0]); tl.fromTo(g, { attr: { transform: zt(...camNow) } }, { attr: { transform: zt(...c) }, duration: dur, ease, immediateRender: false }, t); camNow = c; };
  // motion v2: a glide never peaks above ~37 px/f at 1080 (reference p75): smootherstep peak ≈ 1.875 × corner travel / frames
  const glide = (c, dur) => (MOTION2 ? Math.max(dur, (1.875 * (Math.abs(c[2] - camNow[2]) * 1100 + Math.hypot(c[3] - camNow[3], c[4] - camNow[4]) * c[2])) / 37 / 30) : dur);
  S.zoom = (x, y, k, t, dur = 0.8, ease = "power2.inOut") => camTo([x, y, k, camNow[3], camNow[4]], t, glide([x, y, k, camNow[3], camNow[4]], dur), ease); // push in on (x,y); k=1 comes back
  // punch-in on a punch word: +k over ~1.1 s, eased, starting just before the word (motion v2 grammar; works in any look)
  S.punch = (x, y, t, k = 0.07, dur = 1.1) => camTo([x, y, camNow[2] * (1 + k), camNow[3], camNow[4]], t - 0.1, glide([x, y, camNow[2] * (1 + k), camNow[3], camNow[4]], dur), "power2.inOut", "punch"); // event (whoosh peak) on t-0.1 ≈ the word
  // impact kick: the whole picture jumps, flipping sign every frame, gone in 7 f (reference: 6-8 f, ~4 px at 1080, roll ±0.25°)
  S.kick = (t, amp = 5) => {
    ev(t, "kick");
    const st = document.getElementById("stage");
    for (let i = 0; i < 7; i++) { const a = amp * (1 - i / 7) * (i % 2 ? -1 : 1); tl.set(st, { x: a, y: -a * 0.6, rotation: a * 0.05 }, t + i / 30); }
    tl.set(st, { x: 0, y: 0, rotation: 0 }, t + 7 / 30);
  };
  S.sfx = (t, name, x = 960) => ev(t, "sfx:" + name, x);
  S.stop = (t, d = 0.6) => EVENTS.push([+(+t).toFixed(3), "stop", 960, d]); // music dead stop over [t, t+d] (deadpan punch word) // a sound only (sound.py): whoosh pop swish thud ding tick boing rumble zap
  // depth of field: blur a background element (px at 1080; reference close-ups 7-11 px, wides 0). Costs render time: close-ups only
  S.blur = (e, px = 6) => { const id = "dof" + Math.round(px * 10); if (!document.getElementById(id)) el("filter", { id, x: "-5%", y: "-5%", width: "110%", height: "110%" }, defs).appendChild(document.createElementNS(NS, "feGaussianBlur")).setAttribute("stdDeviation", px); e.setAttribute("filter", `url(#${id})`); return e; };
  S.pan = (dx, dy, t, dur = 1.2, ease = "power1.inOut") => camTo([camNow[0], camNow[1], camNow[2], dx, dy], t, dur, ease);
  S.at = (f) => start + f * S.len; // fraction of the scene -> absolute time
  S.d = (f) => f * S.len; // fraction of the scene -> duration
  S.grp = (parent) => el("g", {}, parent || g);
  S.draw = (d, t, dur, op = {}) => {

    if (op.op !== undefined) p.setAttribute("opacity", op.op);

  };
  // parts: [[d, weight, opts], ...] drawn one after another inside [t, t+dur]

    const tot = parts.reduce((a, p) => a + (p[1] || 1), 0);
    let tt = t;
    return parts.map((p) => {
      const dd = (dur * (p[1] || 1)) / tot, op = Object.assign({ parent: parent || g }, p[2] || {});

    });
  };
  // handwritten text, revealed left->right like a marker. size = font px. font: "ph" (Patrick Hand caps-friendly) | "caveat"
  S.text = (str, x, y, op = {}) => {
    const size = op.size || 64, t = op.t === undefined ? start : op.t, dur = op.dur === undefined ? Math.min(1.2, 0.05 * str.length + 0.25) : op.dur;
    const anchor = op.anchor || "middle", id = "tclip" + ++CLIPN;
    const cp = el("clipPath", { id }, defs);
    const wEst = str.length * size * (op.font === "caveat" ? 0.48 : op.font === "mono" ? 0.6 : V3 ? 0.64 : 0.56) + size; // v3 "PH" = Mali SemiBold (wider)
    const x0 = anchor === "middle" ? x - wEst / 2 : anchor === "end" ? x - wEst : x - size * 0.2;
    const r = el("rect", { x: x0, y: y - size * 1.15, width: 0, height: size * 1.6 }, cp);

  book(S, cx, cy, s = 1, t, dur, o = {}) { // open book centred
    const g = S.grp(o.parent), k = s;
    S.seq([
      [poly([[cx - 240 * k, cy - 70 * k], [cx, cy - 35 * k], [cx, cy + 100 * k], [cx - 240 * k, cy + 65 * k], [cx - 240 * k, cy - 70 * k]], 2), 2, { w: 7, fill: CREAM }],
      [poly([[cx, cy - 35 * k], [cx + 240 * k, cy - 70 * k], [cx + 240 * k, cy + 65 * k], [cx, cy + 100 * k]], 2), 2, { w: 7, fill: CREAM }],
      [[-1, 1].map((sd) => [0, 1, 2].map((i) => poly([[cx + sd * 35 * k, cy - 12 * k + i * 32 * k], [cx + sd * 205 * k, cy - 34 * k + i * 32 * k]], 1)).join("")).join(""), 2, { w: 3.5 }],
    ], t, dur, g);
    return { g };
  },
  underline(S, x1, x2, y, t, dur, o = {}) { return { g: S.draw(poly([[x1, y], [(x1 + x2) / 2, y + 6], [x2, y - 3]], 2), t, dur, { w: o.w || 12, c: o.c || INK, parent: o.parent }) }; },
  // circle highlight around something
  ring(S, cx, cy, rx, ry, t, dur, o = {}) { return { g: S.draw(circ(cx, cy, rx, ry), t, dur, { w: o.w || 7, c: o.c || RED, parent: o.parent }) }; },
  // n small people in a row; o.hi = indices drawn in colour o.hiC; returns figs
  crowd(S, n, x0, gy, gap, s, t, dur, o = {}) {
    const figs = [];
    for (let i = 0; i < n; i++) {
      const hi = (o.hi || []).includes(i);
      const F = fig(S, x0 + i * gap, gy, Object.assign({ s, c: hi ? o.hiC || RED : o.c || INK, parent: o.parent, pose: o.pose }, (o.dress || [])[i % Math.max(1, (o.dress || []).length)])); // o.dress: per-member fig options (v3 hair/outfit)
      F.draw(t + (i * dur * 0.5) / n, dur * 0.5);
      if (o.face) F.face(t + dur * 0.9, hi && o.hiFace ? o.hiFace : o.face);
      figs.push(F);
    }
    return figs;
  },
  hamsterWheel(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent), wheel = S.grp(g);
    S.draw(circ(cx, cy, r), t, dur * 0.5, { w: 8, parent: wheel });
    S.draw(rays(cx, cy, 8, r, 8, 0), t + dur * 0.5, dur * 0.25, { w: 4, parent: wheel });
    S.draw(poly([[cx, cy], [cx - r * 0.55, cy + r * 1.25]], 1) + poly([[cx, cy], [cx + r * 0.55, cy + r * 1.25]], 1) + poly([[cx - r * 0.75, cy + r * 1.25], [cx + r * 0.75, cy + r * 1.25]], 1), t + dur * 0.75, dur * 0.25, { w: 7, parent: g });
    return { g, wheel, spin: (t0, d, turns = 2) => tl.to(wheel, { rotation: 360 * turns, svgOrigin: `${cx} ${cy}`, duration: d, ease: "none" }, t0) };
  },
  flame(S, cx, cy, s = 1, t, dur, o = {}) { // cy = base
    const g = S.grp(o.parent);
    S.draw(smooth([[cx - 40 * s, cy], [cx - 55 * s, cy - 60 * s], [cx - 15 * s, cy - 110 * s], [cx, cy - 160 * s], [cx + 10 * s, cy - 100 * s], [cx + 45 * s, cy - 80 * s], [cx + 42 * s, cy - 20 * s], [cx, cy + 2 * s], [cx - 40 * s, cy]]), t, dur * 0.7, { w: 6, fill: ORANGE, parent: g });
    S.draw(smooth([[cx - 15 * s, cy - 5 * s], [cx - 22 * s, cy - 40 * s], [cx, cy - 75 * s], [cx + 18 * s, cy - 35 * s], [cx + 10 * s, cy - 5 * s]]), t + dur * 0.7, dur * 0.3, { w: 4, fill: YEL, parent: g });
    return { g };
  },
  drop(S, cx, cy, s = 1, t, dur = 0.2, o = {}) { return { g: S.draw(smooth([[cx, cy - 22 * s], [cx - 10 * s, cy], [cx - 9 * s, cy + 10 * s], [cx, cy + 15 * s], [cx + 9 * s, cy + 10 * s], [cx + 10 * s, cy], [cx, cy - 22 * s]]), t, dur, { w: 4, c: BLUE, fill: o.fill || SKY, parent: o.parent }) }; },
  bolt(S, cx, cy, s = 1, t, dur = 0.25, o = {}) { return { g: S.draw(poly([[cx + 20 * s, cy - 70 * s], [cx - 25 * s, cy + 5 * s], [cx + 8 * s, cy + 5 * s], [cx - 18 * s, cy + 75 * s], [cx + 32 * s, cy - 10 * s], [cx, cy - 10 * s], [cx + 20 * s, cy - 70 * s]], 1), t, dur, { w: 5, fill: YEL, parent: o.parent }) }; },
  zzz(S, x, y, t, dur, o = {}) { const g = S.grp(o.parent); ["z", "z", "Z"].forEach((z, i) => S.text(z, x + i * 30, y - i * 34, { size: 40 + i * 12, t: t + (i * dur) / 3, dur: dur / 3, parent: g, c: o.c || INK })); return { g }; },
  // theatre seats row
  seats(S, x0, y, n, gap, t, dur, o = {}) {
    const g = S.grp(o.parent);
    let d = "";
    for (let i = 0; i < n; i++) { const x = x0 + i * gap; d += rrect(x, y - 110, gap * 0.8, 70, 14) + rect(x - 4, y - 46, gap * 0.8 + 8, 30); }
    S.draw(d, t, dur, { w: 5, parent: g, fill: o.fill || (DARK ? "#5a2f33" : "#e8a3a3") });
    return { g };
  },
  // graduation cap (o.kind:"grad") or Napoleon bicorne ("bicorne") centred at (cx,cy)
  hat(S, cx, cy, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent);
    if ((o.kind || "grad") === "grad") S.seq([[poly([[cx - 70 * s, cy], [cx, cy - 30 * s], [cx + 70 * s, cy], [cx, cy + 30 * s], [cx - 70 * s, cy]], 1), 2, { w: 6, fill: INK }], [rect(cx - 36 * s, cy + 10 * s, 72 * s, 30 * s), 1, { w: 6, fill: INK }], [smooth([[cx, cy], [cx + 50 * s, cy + 12 * s], [cx + 58 * s, cy + 52 * s]]), 0.6, { w: 4, c: YEL }]], t, dur, g);
    else S.seq([[smooth([[cx - 95 * s, cy + 20 * s], [cx - 60 * s, cy - 30 * s], [cx, cy - 55 * s], [cx + 60 * s, cy - 30 * s], [cx + 95 * s, cy + 20 * s], [cx, cy + 8 * s], [cx - 95 * s, cy + 20 * s]]), 2, { w: 6, fill: INK }], [circ(cx, cy - 22 * s, 11 * s), 0.6, { w: 4, fill: RED }]], t, dur, g);
    return { g };
  },
  // name tag / label box with text
  tag(S, cx, cy, txt, t, dur, o = {}) {
    const g = S.grp(o.parent), size = o.size || 40, w = txt.length * size * (V3 ? 0.66 : 0.55) + 40, h = size * 1.4;
    S.draw(rrect(cx - w / 2, cy - h / 2, w, h, 10), t, dur * 0.4, { w: 5, fill: o.fill || PAPER, parent: g, c: o.c || INK });
    S.text(txt, cx, cy + size * 0.35, { size, t: t + dur * 0.4, dur: dur * 0.6, parent: g, c: o.tc || INK });
    return { g };
  },
  // checklist: items [text,...] from (x,y) downwards; returns box centres
  checklist(S, x, y, items, t, dur, o = {}) {
    const g = S.grp(o.parent), gap = o.gap || 78, size = o.size || 48, boxes = [];
    items.forEach((txt, i) => {
      const yy = y + i * gap, tt = t + (i * dur) / items.length, d = dur / items.length;
      S.draw(rect(x, yy - 24, 46, 46), tt, d * 0.35, { w: 6, parent: g });
      S.text(txt, x + 70, yy + 16, { size, anchor: "start", t: tt + d * 0.35, dur: d * 0.6, parent: g });
      boxes.push([x + 23, yy]);
    });
    return { g, boxes };
  },
  // split-screen divider (black, full height) at x
  divider(S, x = 960, t, dur = 0.01, o = {}) { return { g: S.draw(`M${x} -20 L${x} 1100`, t, dur, { w: o.w || 10, c: o.c || "#111111", parent: o.parent }) }; },
  // glowing rays burst
  burst(S, cx, cy, r1, r2, n, t, dur, o = {}) { return { g: S.draw(rays(cx, cy, r1, r2, n, o.a0 || 0, o.span || Math.PI * 2), t, dur, { w: o.w || 6, c: o.c || INK, parent: o.parent }) }; },
};

// ---------- captions (bottom line, word-by-word reveal) ----------
function captions(CH) {
  const capsEl = document.getElementById("caps");
  CH.forEach((ch, i) => {
    const ws = ch.slice(0, -1), clipEnd = ch[ch.length - 1];
    const d = document.createElement("div");
    d.className = "cap";
    ws.forEach((w) => {
      const sp = document.createElement("span");
      sp.textContent = w[0];
      d.appendChild(sp);
      tl.to(sp, { opacity: 1, duration: 0.08 }, w[1]);
    });
    capsEl.appendChild(d);
    const t0 = ws[0][1] - 0.05, nxt = CH[i + 1];
    const t1 = nxt && nxt[0][1] - ws[ws.length - 1][2] < 1.2 ? nxt[0][1] - 0.05 : clipEnd + 0.4;
    tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
    tl.to(d, { opacity: 0, duration: 0.2 }, Math.min(t1, TOTAL) - 0.2);
  });
}

// ===================== kit.js — design system for `// look: still` =====================
// Every colour, width, radius, size and gap in a still scene comes from DS (rules + reasons: references/style-guide.md).
// scene_lint.py fails raw hex colours / widths / radii in scenes.js, so scenes stay on-system.

const DS = {
  // palette: [base, light (lit side), dark (shade side)]. Light comes from the top-left.
  P: {
    ink: ["#1d1b1f", "#3a363d", "#000000"], paper: ["#fbf7ef", "#ffffff", "#ece4d4"], white: ["#ffffff", "#ffffff", "#e9e4dc"],
    sky: ["#a9dcf5", "#d6f0fc", "#7cc3ea"], night: ["#2f4a86", "#48649f", "#1c2f5c"], dusk: ["#f6c9a8", "#fbe3cf", "#e3a27c"],
    grass: ["#7cc576", "#a3db8e", "#4f9a48"], earth: ["#d9a86c", "#ecc896", "#b07a43"], sand: ["#ecd49e", "#f6e7c4", "#cfb173"],
    wall: ["#f3e2c4", "#fbf0dc", "#e0c79f"], floor: ["#c8976a", "#dbb58e", "#9c6f48"], wood: ["#b08968", "#cfa888", "#7f5f45"],
    blue: ["#2f6fd6", "#6d9ee8", "#1f4fa3"], navy: ["#1f2a44", "#3a4a6e", "#121a2e"], purple: ["#8e5bb5", "#b48ad6", "#67408a"],
    green: ["#3f9e4a", "#6fc078", "#2c7536"], red: ["#e5383b", "#f2787a", "#b02225"], orange: ["#ff8c1a", "#ffb466", "#d06a00"],
    yellow: ["#ffcf33", "#ffe38a", "#e0a800"], pink: ["#f28ca0", "#f7b6c3", "#d0607a"], gray: ["#9aa0a6", "#c4c8cc", "#6f757b"],
    brown: ["#5a3825", "#7a5236", "#3d2418"], gold: ["#f2b84b", "#f8d58f", "#c98e1c"], glass: ["#dff3ff", "#ffffff", "#b9def5"],
  },
  w: { hair: 2, detail: 3, far: 3, mid: 5, near: 7 },          // stroke px. far < mid < near = depth
  r: { xs: 6, sm: 12, md: 20, lg: 32 },                         // corner radii
  type: { caption: 40, small: 52, body: 64, title: 84, display: 110 }, // text px
  sp: (n) => 8 * n,                                              // spacing grid: 8 px
  safe: { x0: 96, x1: 1824, y0: 64, y1: 940 },                   // keep content inside; captions live below 980
  // depth planes: scale for figures/props, haze = how far the colour moves toward the sky (atmospheric perspective)
  depth: { far: { s: 0.55, haze: 0.45, w: "far" }, mid: { s: 0.8, haze: 0.18, w: "mid" }, near: { s: 1, haze: 0, w: "near" } },
  hazeTo: "#e4f3fb",                                             // scene sky-light; set per scene with DS.setHaze()
};

DS.mix = (a, b, k) => { const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); const A = h(a), B = h(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); };
DS.lum = (c) => { const v = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4)); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
DS.contrast = (a, b) => { const [x, y] = [DS.lum(a), DS.lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
DS.setHaze = (name) => (DS.hazeTo = DS.P[name] ? DS.P[name][1] : name);
// colour by name, tone (0 base, 1 light, 2 dark) and depth layer
DS.c = (name, tone = 0, layer = "near") => DS.mix(DS.P[name][tone], DS.hazeTo, DS.depth[layer].haze);
DS.line = (layer = "near") => DS.mix(DS.P.ink[0], DS.hazeTo, DS.depth[layer].haze * 1.3); // far outlines fade too

let DSN = 0;
const dsDefs = () => document.querySelector("#stage defs");
// diagonal light→dark gradient = volume (key light top-left). Returns "url(#id)".
DS.vol = (name, layer = "near", dir = "diag") => {
  const id = `ds-${name}-${layer}-${dir}`;
  if (!document.getElementById(id)) {
    const [x2, y2] = dir === "v" ? [0, 1] : dir === "h" ? [1, 0] : [1, 1];
    const g = el("linearGradient", { id, x1: 0, y1: 0, x2, y2 }, dsDefs());
    [[0, 1], [0.55, 0], [1, 2]].forEach(([o, tone]) => el("stop", { offset: o, "stop-color": DS.c(name, tone, layer) }, g));
  }
  return `url(#${id})`;
};
DS.vgrad = (top, bottom) => { const id = "ds-vg" + ++DSN, g = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, dsDefs()); el("stop", { offset: 0, "stop-color": top }, g); el("stop", { offset: 1, "stop-color": bottom }, g); return `url(#${id})`; };
DS.glow = (color, op = 0.55) => { const id = "ds-rg" + ++DSN, g = el("radialGradient", { id }, dsDefs()); el("stop", { offset: 0, "stop-color": color, "stop-opacity": op }, g); el("stop", { offset: 1, "stop-color": color, "stop-opacity": 0 }, g); return `url(#${id})`; };

// a solid object: volume fill + outline weighted by depth. o: { layer, t, dir, tone, flat:true (no gradient), parent }
DS.shape = (S, d, name, o = {}) => {
  const layer = o.layer || "near";
  return S.draw(d, o.t ?? S.start, 0, { fill: o.flat ? DS.c(name, o.tone || 0, layer) : DS.vol(name, layer, o.dir), c: o.c || DS.line(layer), w: DS.w[o.w || DS.depth[layer].w], parent: o.parent, op: o.op });
};
// contact shadow under anything that stands on the ground (grounds it; without it things float)
DS.shadow = (S, cx, gy, w, o = {}) => S.fill(circ(cx, gy + 2, w / 2, w * 0.07), o.t ?? S.start, 0.3, DS.P.ink[0], o.op ?? 0.22, o.parent);
// soft drop shadow for cards / foreground objects: offset copy, low opacity
DS.drop = (S, d, o = {}) => S.fill(d, o.t ?? S.start, 0.3, DS.P.ink[0], 0.14, o.parent);

// label card: rounded, padded, shadowed; text always ink-on-paper (contrast ≥ 12:1) unless tc given.
DS.card = (S, str, cx, cy, o = {}) => {
  const size = o.size || DS.type.small, t = o.t ?? S.start, pad = [DS.sp(3), DS.sp(1.5)], w = str.length * size * 0.62 + pad[0] * 2, h = size * 1.15 + pad[1] * 2, g = S.grp(o.parent);
  const x = cx - w / 2, y = cy - h / 2, r = DS.r[o.r || "md"];
  S.fill(rrect(x + 4, y + 8, w, h, r), t, 0.3, DS.P.ink[0], 0.14, g);
  S.draw(rrect(x, y, w, h, r), t, 0, { fill: o.fill ? DS.c(o.fill, 1) : DS.P.white[0], c: DS.P.ink[0], w: DS.w.detail, parent: g });
  S.text(str, cx, cy + size * 0.36, { size, t, c: o.tc ? DS.c(o.tc, 2) : DS.P.ink[0], parent: g });
  if (t > S.start + 0.05) tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.35 }, t);
  return { g, w, h };
};

// ---------- scenery with depth ----------
// outdoor: gradient sky, sun glow, 3 hill planes hazed by distance, ground gradient, optional path to the horizon
DS.outdoor = (S, o = {}) => {
  const hy = o.hy || 640, sky = o.sky || "sky", g = S.grp(); S.g.insertBefore(g, S.g.firstChild);
  DS.setHaze(sky);
  const sh = (d, fill, op) => { const p = el("path", { d, fill }, g); if (op !== undefined) p.setAttribute("opacity", op); return p; };
  const box = (x0, y0, x1, y1) => `M${x0} ${y0} H${x1} V${y1} H${x0} Z`;
  sh(box(-200, -200, 2120, 1280), DS.vgrad(DS.P[sky][2], DS.P[sky][1]));
  if (o.sun !== false) { const [sx, sy] = o.sun || [1560, 200]; sh(circ(sx, sy, 300), DS.glow("#fff6d6", 0.8)); sh(circ(sx, sy, 70), "#fff6d6"); }
  const ridge = (y, amp, ph) => smooth(Array.from({ length: 9 }, (_, i) => [-200 + i * 290, y - amp * (0.5 + 0.5 * Math.sin(i * 1.3 + ph))])) + " L2120 1280 L-200 1280 Z";
  [["far", hy - 70, 70, 0.7], ["mid", hy - 25, 45, 2.2]].forEach(([L, y, a, ph]) => sh(ridge(y, a, ph), DS.c(o.hills || "grass", L === "far" ? 1 : 0, L)));
  sh(ridge(hy + 20, 14, 4.1), DS.vgrad(DS.c(o.ground || "grass", 0, "mid"), DS.c(o.ground || "grass", 2)));
  if (o.path) sh(`M${o.path[0]} 1280 L${960 - 18} ${hy + 22} L${960 + 18} ${hy + 22} L${o.path[1]} 1280 Z`, DS.vgrad(DS.c("sand", 0, "mid"), DS.c("sand", 1)));
  return { g, hy };
};
// room interior in one-point perspective: back wall, side walls, floor with converging boards, baseboard, window + light patch
DS.room = (S, o = {}) => {
  const g = S.grp(); S.g.insertBefore(g, S.g.firstChild);
  const [bx0, by0, bx1, by1] = o.back || [360, 90, 1560, 760];   // back wall rectangle; the vanishing point is its centre
  DS.setHaze("wall");
  const sh = (d, fill, op) => { const p = el("path", { d, fill }, g); if (op !== undefined) p.setAttribute("opacity", op); return p; };
  const P4 = (pts) => `M${pts.map((p) => p.join(" ")).join(" L")} Z`;
  sh(P4([[-200, -200], [bx0, by0], [bx0, by1], [-200, 1280]]), DS.vgrad(DS.c(o.wall || "wall", 2), DS.c(o.wall || "wall", 0)));       // left wall (shade side)
  sh(P4([[2120, -200], [bx1, by0], [bx1, by1], [2120, 1280]]), DS.vgrad(DS.c(o.wall || "wall", 0), DS.c(o.wall || "wall", 1)));       // right wall (lit)
  sh(P4([[-200, -200], [2120, -200], [bx1, by0], [bx0, by0]]), DS.c(o.wall || "wall", 1));                                       // ceiling
  sh(P4([[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]]), DS.vgrad(DS.c(o.wall || "wall", 1), DS.c(o.wall || "wall", 0)));          // back wall
  sh(P4([[bx0, by1], [bx1, by1], [2120, 1280], [-200, 1280]]), DS.vgrad(DS.c(o.floor || "floor", 0, "mid"), DS.c(o.floor || "floor", 2)));
  const vx = (bx0 + bx1) / 2, n = 9;
  for (let i = 1; i < n; i++) { const fx = bx0 + ((bx1 - bx0) * i) / n, ex = -200 + (2320 * i) / n; el("path", { d: `M${fx} ${by1} L${ex} 1280`, stroke: DS.c(o.floor || "floor", 2), "stroke-width": DS.w.hair, opacity: 0.5 }, g); }
  sh(P4([[bx0, by1 - 22], [bx1, by1 - 22], [bx1, by1], [bx0, by1]]), DS.c("white", 2));                                              // baseboard
  if (o.window !== false) {
    const [wx, wy, ww, wh] = o.window || [bx1 - 380, by0 + 90, 260, 300];
    sh(rrect(wx - 14, wy - 14, ww + 28, wh + 28, DS.r.xs), DS.c("white", 0)); sh(rect(wx, wy, ww, wh), DS.vgrad(DS.P.sky[1], DS.P.sky[0]));
    el("path", { d: `M${wx + ww / 2} ${wy} V${wy + wh} M${wx} ${wy + wh / 2} H${wx + ww}`, stroke: DS.c("white", 0), "stroke-width": DS.w.near }, g);
    sh(P4([[wx, by1 + 30], [wx + ww, by1 + 30], [wx + ww * 1.5 - vx * 0.0, 1080], [wx - ww * 0.3, 1080]]), "#fff6d6", 0.22);          // light patch on the floor
  }
  return { g, hy: by1, vp: [vx, (by0 + by1) / 2] };
};
// a figure placed on a depth plane: scale, stroke and a contact shadow follow the layer
DS.figure = (S, x, gy, layer = "near", o = {}) => {
  const L = DS.depth[layer], s = (o.s || 1.1) * L.s;
  DS.shadow(S, x, gy, 150 * s, { t: o.t });
  const F = S.fig(x, gy, Object.assign({ hair: "short", outfit: "tee" }, o, { s, w: DS.w[L.w] * 1.3 * Math.sqrt(s) })).draw(o.t ?? S.start, 0.4); // characters 1.3x the plane width so they pop from the set
  F.face(o.t ?? S.start, o.mood || "flat", o.look || 0);
  return F;
};

// ---------- finishing: focus, detail, foreground depth ----------
// vignette: edges 12 % darker, pulls the eye to the centre (always last, on top of the scene)
DS.vignette = (S, k = 0.12) => { const id = "ds-vig" + ++DSN, g = el("radialGradient", { id, cx: 0.5, cy: 0.5, r: 0.75 }, dsDefs()); el("stop", { offset: 0.55, "stop-color": DS.P.ink[0], "stop-opacity": 0 }, g); el("stop", { offset: 1, "stop-color": DS.P.ink[0], "stop-opacity": k }, g); return el("path", { d: "M-200 -200 H2120 V1280 H-200 Z", fill: `url(#${id})`, "pointer-events": "none" }, S.g); };
// rug in perspective under a group of people (ties them to the floor)

// ---------- frame cycles ----------
// each cycle = n poses "cyc-<key>-<i>" + one asset "cycle-<key>" taking { frame: 0..n-1 } (no frame = sprite sheet). Use via L.put(S, "cycle-walk", x, gy, { frame, s, t }).
const gait = (i, n, a) => {
  const p = (i / n) * 360, lt = [0, 180].map((ph) => { const t = a.amp * sin(p + ph); return [0, t, t - a.bend * Math.max(0, cos(p + ph))]; });
  const foot = Math.max(...lt.map((l) => legT(...l)[1][1]));
  const sw = (ph) => a.arm * (0.5 + 0.5 * sin(p + ph)); // arms swing outward only (never cross the torso)
  return { lt: lt[0], rt: lt[1], al: [-1, sw(180), sw(180) + a.flex], ar: [1, sw(0), sw(0) + a.flex], xf: { drop: r1(130 - foot - (a.fly || 0) * Math.abs(sin(p))), rot: a.lean || 0 } };
};
const CYC = {};
const cycle = (key, label, frames, cfg = {}) => {
  const n = frames.length; CYC[key] = { n };
  frames.forEach((f, i) => defPose(`cyc-${key}-${i}`, f));
  const person = (o, i, s) => L.person(Object.assign({ style: "man01", face: cfg.face || "smile", look: cfg.look }, cfg.opt ? cfg.opt(i) : {}, o, { pose: `cyc-${key}-${i}`, s }));
  L.reg("motion", "cycle-" + key, (o) => {
    if (o.frame !== undefined && o.frame !== null) return person(o, ((Math.round(o.frame) % n) + n) % n, 1); // L.put applies o.s itself
    const sc = cfg.sheetS || 0.5, st = cfg.step || 170, W = n * st;
    return frames.map((_, i) => L.g(person(o, i, sc), `translate(${f1((i + 0.5) * st - W / 2)} 0)`) + L.text(i, (i + 0.5) * st - W / 2, 30, { size: 22 })).join("");
  }, { box: [-(n * (cfg.step || 170)) / 2 - 10, -(400 * (cfg.sheetS || 0.5) + (cfg.up || 0)), n * (cfg.step || 170) + 20, 400 * (cfg.sheetS || 0.5) + (cfg.up || 0) + 46], group: "Cycles", wide: true, label: `${label} · ${n} frames`,
    tags: ["cycle", "frames", "sprite", key], call: `L.put(S, "cycle-${key}", x, gy, { frame: k % ${n}, s, t })  // ${n} frames: step k each ~${cfg.fps || 8} fps`, demo: {} });
};
cycle("walk", "Walk cycle", Array.from({ length: 8 }, (_, i) => gait(i, 8, { amp: 24, bend: 38, arm: 26, flex: 14 })), { look: 0.7, fps: 10 });
cycle("run", "Run cycle", Array.from({ length: 6 }, (_, i) => gait(i, 6, { amp: 52, bend: 85, arm: 60, flex: 50, lean: 8, fly: 14 })), { look: 0.7, face: "determined", fps: 12, step: 200 });

cycle("idle", "Idle bob", Array.from({ length: 6 }, (_, i) => { const d = r1(7 * (0.5 - 0.5 * cos((i / 6) * 360))); return { ll: [-35, 130 - d], rl: [35, 130 - d], l: [-72, 100 + d * 0.3], r: [72, 100 + d * 0.3], xf: { drop: d } }; }), { fps: 4 });

cycle("nod", "Nod", nodD.map((d) => ({ ll: [-35, 130 - d], rl: [35, 130 - d], xf: { drop: d, rot: d * 0.4, planted: true } })), { fps: 6 });

// ---------- faces ----------
const kebab = (s) => s.replace(/([A-Z])/g, "-$1").toLowerCase();
const headTile = (kind, o = {}) => {

};

const cap = (t, sub) => L.text(t, 0, 112, { size: 30 }) + (sub ? L.text(sub, 0, 140, { size: 22, c: "gray" }) : "");

(function () {
const L = window.L, f1 = L.f1;
const C = { bg: "#15171c", grid: "#1f2229", paper: "#f4f1e8", paper2: "#e3dece", lime: "#b6f24a", pink: "#ff4d8d", cyan: "#4cc9f0", yellow: "#ffd23f",
  white: "#ffffff", ink: "#1d1b1f", ink2: "#3a363d", gray: "#8b909a", panel: "#242831" };
const col = (n) => C[n] || n;

// ---------- text measuring (Mono is exactly 0.6 em; Mali advance widths measured in Chrome, per 100 px, ASCII 32…126) ----------
const MALI = [35,27,41,62,60,93,74,25,37,37,50,55,31,42,30,56,63,44,56,60,62,58,61,56,62,60,32,35,55,55,55,54,90,70,66,73,71,62,61,76,77,49,62,64,56,81,75,81,66,80,68,61,58,69,66,86,68,66,70,36,49,36,61,57,31,62,64,60,63,60,42,59,58,33,36,54,26,80,57,60,63,64,52,50,44,56,54,77,52,54,56,42,30,42,55];
const cw = (ch, mono) => (mono ? 0.6 : (MALI[ch.charCodeAt(0) - 32] ?? 60) / 100);
const tw = (s, size, mono) => [...String(s)].reduce((a, ch) => a + cw(ch, mono), 0) * size;
L.sdTw = tw; // text width helper for brand/thumbnail sources: L.sdTw(str, size, mono)
const wrap = (s, size, maxW) => {
  const out = []; let cur = "";
  for (const wd of String(s).split(" ")) { const t = cur ? cur + " " + wd : wd; if (cur && tw(t, size) > maxW) { out.push(cur); cur = wd; } else cur = t; }
  if (cur) out.push(cur); return out;
};
const topRound = (x, y, w, h, r) => `M${f1(x)} ${f1(y + h)} V${f1(y + r)} Q${f1(x)} ${f1(y)} ${f1(x + r)} ${f1(y)} H${f1(x + w - r)} Q${f1(x + w)} ${f1(y)} ${f1(x + w)} ${f1(y + r)} V${f1(y + h)} Z`;
const hardShadow = (d, dx = 7, dy = 9, op = 0.55) => L.g(L.flat(d, "#000000", op), `translate(${dx} ${dy})`);

// cream die-cut "sticker" rim around cast so ink outlines/limbs read on graphite
const rim = (inner, r = 5, c = C.paper) => `<filter id="sdrim${Math.round(r * 10)}" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="${f1(r)}" result="d"/><feFlood flood-color="${c}"/><feComposite in2="d" operator="in" result="rim"/><feMerge><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge></filter><g filter="url(#sdrim${Math.round(r * 10)})">${inner}</g>`;

// ---------- the channel mark: three stacked layers (isometric slabs), top one lime ----------
const mark = () => {
  const slab = (cy, name) => {
    const hw = 96, hh = 46, th = 26, j = L.rng(Math.round(cy) + 5), w = () => (j() - 0.5) * 3;
    const T = [[-hw + w(), cy], [w(), cy - hh + w()], [hw + w(), cy], [w(), cy + hh + w()]];
    const side = (a, b) => L.poly([a, b, [b[0], b[1] + th], [a[0], a[1] + th]], true);
    return L.shape(side(T[0], T[3]), name, { tone: 2, flat: true }) + L.shape(side(T[3], T[2]), name, { tone: 2, flat: true })
      + L.shape(L.poly(T, true), name, { flat: true });
  };
  return slab(50, C.cyan) + slab(10, C.pink) + slab(-30, C.lime)
    + L.stroke(L.smooth([[-50, -33], [-10, -19], [32, -41]]), { c: C.ink, w: 7 }); // a doodle squiggle on the top layer
};
L.reg("sd", "sd-mark", (o) => (o.rim ? rim(mark(), o.rim) : mark()), { box: [-130, -90, 260, 220], group: "Brand", label: "Stack Doodle mark", tags: ["logo", "stack", "layers", "brand"],
  call: 'L.put(S, "sd-mark", x, y, { s, rim: 6, t })' });

// ---------- pencil (origin = the tip; points left-down at rot 0 → draw with rot to aim) ----------
L.reg("sd", "sd-pencil", (o) => {
  const len = o.len || 420, Y = C.yellow, b0 = 100, b1 = b0 + len;
  return L.shape(L.poly([[0, 0], [b0, -36], [b0, 36]], true), C.paper, { flat: true }) + L.shape(L.poly([[0, 0], [34, -13], [34, 13]], true), C.ink, { flat: true, w: "detail" })
    + L.shape(L.rect(b0, -36, len, 72), Y, { flat: true }) + L.stroke(L.line([b0, -12], [b1, -12]), { c: C.ink, w: 4, op: 0.5 }) + L.stroke(L.line([b0, 14], [b1, 14]), { c: C.ink, w: 4, op: 0.5 })
    + L.shape(L.rect(b1, -36, 44, 72), C.gray, { flat: true }) + L.shape(L.rrect(b1 + 44, -34, 58, 68, 26), C.pink, { flat: true });
}, { box: [-20, -60, 700, 120], group: "Brand", label: "Pencil", tags: ["pencil", "doodle", "draw"], call: 'L.put(S, "sd-pencil", x, y, { s: 1, rot: -35, len: 420, t })   // origin = the tip', demo: {} });

// ---------- background ----------
L.reg("sd", "sd-bg", (o) => {
  let s = L.flat(L.rect(-40, -40, 2000, 1160), C.bg);
  let d = ""; for (let x = -60; x <= 1980; x += 60) d += `M${x} -40V1120`; for (let y = -60; y <= 1140; y += 60) d += `M-40 ${y}H1960`;
  s += L.stroke(d, { c: C.grid, w: 2 });
  if (o.glow) {
    const gc = col(o.glow === true ? "lime" : o.glow), id = "sdg" + gc.slice(1), r = o.gr || 700;
    s += `<radialGradient id="${id}"><stop offset="0" stop-color="${gc}" stop-opacity="0.22"/><stop offset="1" stop-color="${gc}" stop-opacity="0"/></radialGradient>`
      + `<ellipse cx="${o.gx ?? 960}" cy="${o.gy ?? 480}" rx="${r}" ry="${r * 0.7}" fill="url(#${id})"/>`;
  }
  if (o.vignette !== false) s += `<radialGradient id="sdvig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/></radialGradient><rect x="-40" y="-40" width="2000" height="1160" fill="url(#sdvig)"/>`;
  return s;
}, { box: [0, 0, 1920, 1080], group: "Frame", label: "Graphite grid ground", tags: ["background", "grid", "dark"],
  call: 'L.put(S, "sd-bg", 0, 0, { glow: "lime|cyan|pink|yellow|#hex", gx, gy, gr, vignette: true })', demo: { glow: "lime", gx: 1400, gy: 380 }, wide: true });

// ---------- animated grounds (L.sdBg) ----------
// L.sdBg(S, kind, { c: "lime|cyan|pink|yellow|#hex" (tint), seed, glow… }) = an animated graphite ground for one scene; the
// motion is plain GSAP tweens on the paused timeline (seek-safe, no sound events), layouts come from a seeded PRNG.
// kinds: grid (the old static sd-bg, default) | drift | glyphs | circuit | dots | scan | blob | network.
// Calm by design: everything is 6-12 % brighter than the ground and moves 8-40 px/s. Rotate kinds per scene: the 0.6 s
// scene crossfade blends one ground into the next.
const prng = (seed) => () => ((seed = (seed * 16807) % 2147483647), (seed - 1) / 2147483646);
const gridD = (step, x0, y0, x1, y1) => { let d = ""; for (let x = x0; x <= x1; x += step) d += `M${x} ${y0}V${y1}`; for (let y = y0; y <= y1; y += step) d += `M${x0} ${y}H${x1}`; return d; };
const VIG = `<radialGradient id="sdvig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/></radialGradient><rect x="-40" y="-40" width="2000" height="1160" fill="url(#sdvig)"/>`;
const BGK = {
  drift: (o) => `<g data-m="far"><path d="${gridD(60, -120, -120, 2400, 1560)}" stroke="${C.grid}" stroke-width="2" fill="none"/></g>`
    + `<g data-m="near"><path d="${gridD(240, -480, -480, 2640, 1680)}" stroke="#272b34" stroke-width="3" fill="none"/></g>`,
  glyphs: (o, r, tc) => { const G = ["{ }", "</>", "( )", "[ ]", "=>", ";", "&&", "#", "$", "01", "fn", "::", "!=", "//", "<>", "λ", "++", "{}"];
    let s = `<path d="${gridD(60, -60, -60, 1980, 1140)}" stroke="${C.grid}" stroke-width="2" fill="none" opacity="0.5"/>`;
    for (let i = 0; i < 26; i++) { const z = 0.4 + r() * 0.6, x = f1(r() * 1920), y = f1(-80 + r() * 1500), sz = f1(30 + z * 70);
      s += `<text data-m="g${f1(z)}" x="${x}" y="${y}" font-family="Mono" font-weight="700" font-size="${sz}" fill="${i % 5 ? "#2c313b" : tc}" fill-opacity="${i % 5 ? 1 : 0.22}" text-anchor="middle">${G[Math.floor(r() * G.length)].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</text>`; }
    return s; },
  circuit: (o, r, tc) => { let base = "", hot = "", pads = "";
    for (let i = 0; i < 16; i++) { let x = Math.round(r() * 32) * 60, y = Math.round(r() * 18) * 60, d = `M${x} ${y}`;
      for (let k = 0; k < 4; k++) { const L1 = (2 + Math.floor(r() * 6)) * 60; if (k % 2) y += r() < 0.5 ? L1 : -L1; else x += r() < 0.5 ? L1 : -L1; d += `L${x} ${y}`; }
      base += `<path d="${d}" stroke="#252a33" stroke-width="4" fill="none" stroke-linejoin="round"/>`;
      hot += `<path data-m="p${f1(r())}" d="${d}" pathLength="1000" stroke="${tc}" stroke-opacity="0.32" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="70 930"/>`;
      pads += `<circle cx="${x}" cy="${y}" r="9" fill="${C.bg}" stroke="#2c313b" stroke-width="4"/>`; }
    return `<path d="${gridD(60, -60, -60, 1980, 1140)}" stroke="${C.grid}" stroke-width="2" fill="none" opacity="0.45"/>` + base + hot + pads; },
  dots: () => { let d = ""; // rows already bent on a sine; the layer slides sideways, so the wave travels
    for (let y = -40; y <= 1120; y += 40) for (let x = -40; x <= 2680; x += 40) { const yy = f1(y + 14 * Math.sin((x / 640) * 2 * Math.PI + y / 260)); d += `M${x} ${yy}h0.01`; }
    return `<g data-m="wave"><path d="${d}" stroke="#30353f" stroke-width="5" stroke-linecap="round" fill="none"/></g>`; },
  scan: (o, r, tc) => `<path d="${gridD(60, -60, -60, 1980, 1140)}" stroke="${C.grid}" stroke-width="2" fill="none" opacity="0.35"/>`
    + `<path d="${Array.from({ length: 182 }, (_, i) => `M-40 ${i * 6}H1960`).join("")}" stroke="#1b1d23" stroke-width="2" fill="none"/>`
    + `<linearGradient id="sdscan${tc.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tc}" stop-opacity="0"/><stop offset="0.5" stop-color="${tc}" stop-opacity="0.07"/><stop offset="1" stop-color="${tc}" stop-opacity="0"/></linearGradient>`
    + `<g data-m="band"><rect x="-40" y="-170" width="2000" height="340" fill="url(#sdscan${tc.slice(1)})"/></g>`,
  blob: (o, r, tc) => { const t2 = col(o.c2 || "cyan"), gid = (c) => "sdb" + c.slice(1);
    const grad = (c, a) => `<radialGradient id="${gid(c)}"><stop offset="0" stop-color="${c}" stop-opacity="${a}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
    return grad(tc, 0.2) + grad(t2, 0.13) + `<g data-m="b0"><ellipse cx="1350" cy="380" rx="760" ry="540" fill="url(#${gid(tc)})"/></g>`
      + `<g data-m="b1"><ellipse cx="520" cy="760" rx="680" ry="480" fill="url(#${gid(t2)})"/></g>`
      + `<path d="${gridD(60, -60, -60, 1980, 1140)}" stroke="${C.grid}" stroke-width="2" fill="none" opacity="0.6"/>`; },
  network: (o, r, tc) => { const N = []; for (let j = 0; j < 6; j++) for (let i = 0; i < 9; i++) N.push([f1(-200 + i * 290 + (r() - 0.5) * 170), f1(-120 + j * 270 + (r() - 0.5) * 150)]);
    let e = "", pulses = "", nodes = "";
    N.forEach((a, k) => [k + 1, k + 9, k + 10].forEach((m, q) => { const b = N[m]; if (!b || (q !== 1 && m % 9 === 0) || r() < 0.3) return;
      e += `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`; if (r() < 0.22) pulses += `<circle data-m="e${a[0]},${a[1]},${b[0]},${b[1]},${f1(r())}" cx="${a[0]}" cy="${a[1]}" r="6" fill="${tc}" fill-opacity="0.4"/>`; }));
    N.forEach((a, k) => (nodes += `<circle cx="${a[0]}" cy="${a[1]}" r="${k % 7 ? 8 : 13}" fill="${C.bg}" stroke="${k % 7 ? "#2e3440" : tc}" stroke-opacity="${k % 7 ? 1 : 0.35}" stroke-width="4"/>`));
    return `<g data-m="net"><path d="${e}" stroke="#242933" stroke-width="3" fill="none"/>${pulses}${nodes}</g>`; },
};
L.reg("sd", "sd-bg-anim", (o) => { const tc = col(o.c || "lime"), r = prng(o.seed || 11);
  return L.flat(L.rect(-40, -40, 2000, 1160), C.bg) + BGK[o.kind](o, r, tc) + (o.vignette !== false ? VIG : ""); },
{ box: [0, 0, 1920, 1080], group: "Frame", label: "Animated ground (use L.sdBg)", tags: ["background", "animated", "dark"],
  call: 'L.sdBg(S, "drift|glyphs|circuit|dots|scan|blob|network|grid", { c: "lime", seed })', demo: { kind: "network", c: "cyan" }, wide: true });
L.SD_BGS = Object.keys(BGK);
L.sdBg = (S, kind = "grid", o = {}) => {
  if (kind === "grid" || !BGK[kind]) return L.put(S, "sd-bg", 0, 0, o);
  const g = L.put(S, "sd-bg-anim", 0, 0, Object.assign({}, o, { kind })), t0 = Math.max(0, S.start - 0.6), T = S.end - t0;
  const q = (sel) => [...g.querySelectorAll(sel)], tr = (x, y, extra = "") => `translate(${f1(x)} ${f1(y)})${extra}`;
  const lin = (e, x, y, extra) => tl.fromTo(e, { attr: { transform: tr(0, 0) } }, { attr: { transform: tr(x, y, extra) }, duration: T, ease: "none", immediateRender: false }, t0);
  const sp = o.speed || 1;
  if (kind === "drift") { lin(q('[data-m="far"]')[0], -10 * sp * T, -6 * sp * T); lin(q('[data-m="near"]')[0], -24 * sp * T, -14 * sp * T); }
  if (kind === "glyphs") q("[data-m]").forEach((e) => { const z = +e.dataset.m.slice(1); lin(e, 0, -(10 + 30 * z) * sp * T); });
  if (kind === "dots") lin(q('[data-m="wave"]')[0], -22 * sp * T, 0);
  if (kind === "network") lin(q('[data-m="net"]')[0], -9 * sp * T, -5 * sp * T);
  if (kind === "circuit") q("[data-m]").forEach((e) => { const ph = +e.dataset.m.slice(1);
    tl.fromTo(e, { strokeDashoffset: 1000 * ph }, { strokeDashoffset: 1000 * ph - 1000, duration: 6 / sp, ease: "none", repeat: Math.ceil(T * sp / 6), immediateRender: false }, t0); });
  if (kind === "scan") tl.fromTo(q('[data-m="band"]')[0], { attr: { transform: tr(0, -200) } }, { attr: { transform: tr(0, 1280) }, duration: 7 / sp, ease: "none", repeat: Math.ceil(T * sp / 7), immediateRender: false }, t0);
  if (kind === "blob") [[-220, 120, 11], [260, -140, 9]].forEach(([dx, dy, p], i) =>
    tl.fromTo(q(`[data-m="b${i}"]`)[0], { attr: { transform: tr(0, 0) } }, { attr: { transform: tr(dx, dy) }, duration: p / 2 / sp, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(T * sp / (p / 2)), immediateRender: false }, t0));
  if (kind === "network") q("circle[data-m]").forEach((e) => { const [ax, ay, bx, by, ph] = e.dataset.m.slice(1).split(",").map(Number), d = 2.6 / sp;
    tl.fromTo(e, { attr: { cx: ax, cy: ay } }, { attr: { cx: bx, cy: by }, duration: d, ease: "sine.inOut", repeat: Math.ceil(T / d), delay: ph * d, immediateRender: false }, t0); });
  return g;
};

// ---------- chip ----------
L.reg("sd", "sd-chip", (o) => {
  const lines = String(o.text ?? "NEW").split("|"), size = o.size || 46, n = Math.max(...lines.map((l) => l.length));
  const w = n * size * 0.64 + size * 1.1, h = lines.length * size * 1.2 + size * 0.5, c = col(o.c || "lime");
  const d = L.rrect(-w / 2, -h / 2, w, h, size * 0.32);
  let s = hardShadow(d, size * 0.14, size * 0.18) + L.shape(d, c, { flat: true });
  lines.forEach((ln, i) => (s += L.text(ln, 0, (i - (lines.length - 1) / 2) * size * 1.2 + size * 0.35, { size, c: C.ink, font: "Mono", weight: 800, spacing: size * 0.04 })));
  return s;
}, { box: [-300, -80, 600, 160], group: "Labels", label: "Chip (Mono label block)", tags: ["chip", "label", "keyword", "tag"],
  call: 'L.put(S, "sd-chip", x, y, { text: "WE RAN IT", c: "lime|pink|cyan|white|yellow", size: 46, rot: -3, t, pop: true })', demo: { text: "WE RAN IT", c: "lime", rot: 0 } });

// ---------- evidence card ----------
L.reg("sd", "sd-source", (o) => {
  const w = o.w || 880, padX = 44, size = o.size || 36, hs = o.headSize || 50, logoW = o.logo ? 118 : 0;
  const head = wrap(o.head || "", hs, w - 2 * padX - logoW), body = (o.body || []).map((b) => wrap(b, size, w - 2 * padX));
  const hl = [].concat(o.hl === undefined ? [] : o.hl), barH = 62, lineH = size * 1.45, headLH = hs * 1.16;
  const headH = Math.max(head.length * headLH, o.logo ? 96 : 0), bodyH = body.reduce((a, b) => a + b.length * lineH, 0) + Math.max(0, body.length - 1) * 10;
  const h = barH + 30 + headH + 22 + bodyH + (o.date ? 58 : 34), x0 = -w / 2, y0 = -h / 2, r = 26 * L.T.radius;
  let s = hardShadow(L.rrect(x0, y0, w, h, 26), 12, 14, 0.5) + L.shape(L.rrect(x0, y0, w, h, 26), C.paper, { flat: true });
  s += L.flat(topRound(x0 + 1.5, y0 + 1.5, w - 3, barH, Math.max(0, r - 1.5)), C.paper2);
  s += L.stroke(L.line([x0, y0 + barH], [x0 + w, y0 + barH]), { c: C.ink, w: 3 });
  [C.pink, C.yellow, C.lime].forEach((c, i) => (s += L.shape(L.circ(x0 + 38 + i * 36, y0 + barH / 2, 11), c, { flat: true, w: "detail" })));
  s += L.text(o.site || "", x0 + 150, y0 + barH / 2 + 9, { size: 26, c: C.ink2, font: "Mono", weight: 500, anchor: "start" });
  let y = y0 + barH + 30;
  head.forEach((ln, i) => (s += L.text(ln, x0 + padX, y + hs * 0.82 + i * headLH, { size: hs, c: C.ink, anchor: "start", weight: 700 })));
  if (o.logo) s += L.g(L.inline(o.logo, {}), `translate(${f1(x0 + w - padX - 50)} ${f1(y + headH / 2)}) scale(1.05)`);
  y += headH + 22;
  body.forEach((lines, bi) => {
    lines.forEach((ln, li) => {
      const base = y + size * 0.95;
      if (hl.includes(bi)) s += L.g(L.flat(L.rrect(x0 + padX - 12, base - size * 0.92, Math.min(tw(ln, size) * 1.03 + 24, w - 2 * padX + 24), size * 1.3, 9), C.lime), `rotate(-0.6 ${x0 + padX} ${f1(base)})`);
      s += L.text(ln, x0 + padX, base, { size, c: C.ink2, anchor: "start" });
      y += lineH;
    });
    y += 10;
  });
  if (o.date) s += L.text(o.date, x0 + w - padX, y0 + h - 22, { size: 24, c: C.gray, font: "Mono", weight: 500, anchor: "end" });
  return s + L.g(L.flat(L.rect(-70, y0 - 20, 140, 40), C.yellow, 0.85), "rotate(-3 0 " + f1(y0) + ")");
}, { box: [-500, -330, 1000, 660], group: "Labels", label: "Evidence card (source quote, highlighted)", tags: ["source", "evidence", "quote", "card", "news", "highlight"],
  call: 'L.put(S, "sd-source", x, y, { site: "bun.sh/blog", head: "Bun 1.3 is out", body: ["line one", "line two"], hl: 1, logo: "logo-bun", date: "OCT 22, 2026", w: 880, size: 36, t, slide: "up" })',
  demo: { site: "example.dev/blog", head: "Version 3 is out", body: ["It ships a built-in client.", "Startup is twice as fast.", "Nothing else changed."], hl: 1, date: "OCT 22, 2026" } });

// ---------- year stamp ----------
L.reg("sd", "sd-year", (o) => {
  const size = o.size || 240, c = col(o.c || "lime"), yr = String(o.year ?? "2014"), w = tw(yr, size, true);
  let s = L.text(yr, size * 0.04, size * 0.35 + size * 0.05, { size, c, font: "Mono", weight: 800, halo: C.bg, haloW: 0.14 });
  s += L.text(yr, -size * 0.03, size * 0.35 - size * 0.03, { size, c: C.white, font: "Mono", weight: 800, halo: C.bg, haloW: 0.08 });
  s += L.stroke(L.smooth([[-w / 2, size * 0.54], [-w / 6, size * 0.5], [w / 5, size * 0.58], [w / 2, size * 0.52]]), { c, w: size * 0.045 });
  if (o.label) s += L.g(L.inline("sd-chip", { text: o.label, c: o.lc || "yellow", size: size * 0.16 }), `translate(${f1(-w / 2 + size * 0.5)} ${f1(-size * 0.55)}) rotate(-4)`);
  return s;
}, { box: [-460, -200, 920, 400], group: "Labels", label: "Year stamp", tags: ["year", "date", "stamp", "history"],
  call: 'L.put(S, "sd-year", x, y, { year: "2014", c: "lime", size: 240, label: "RELEASED", t, pop: true })', demo: { year: "2014", label: "RELEASED" } });

// ---------- series badge (origin = left-centre; always the same size and place) ----------
const KIND = { "PATCH NOTES": "lime", POSTMORTEM: "pink", DOODLED: "cyan", "CHEAT SHEET": "yellow", LAB: "white" };
L.reg("sd", "sd-badge", (o) => {
  const kind = String(o.kind || "PATCH NOTES").toUpperCase(), c = col(o.c || KIND[kind] || "lime"), h = 84, size = 34;

  const k = size * 0.45; let a, b, up;
  if (side === "b" || side === "t") { const bx = Math.max(x0 + 40, Math.min(x0 + w - 40, tx * 0.5)), yy = side === "b" ? h / 2 : -h / 2, e = side === "b" ? -5 : 5; a = [bx - k, yy]; b = [bx + k, yy]; up = [[bx - k, yy + e], [bx + k, yy + e]]; }
  else { const by = Math.max(y0 + 40, Math.min(y0 + h - 40, ty * 0.5)), xx = side === "r" ? w / 2 : -w / 2, e = side === "r" ? -5 : 5; a = [xx, by - k]; b = [xx, by + k]; up = [[xx + e, by - k], [xx + e, by + k]]; }

  s += L.flat(L.poly([a, [tx, ty], b, up[1], up[0]], true), c) + L.stroke(L.poly([a, [tx, ty], b]), { c: C.ink, w: "prop" });

  { box: [-160, -230, 320, 270], group: "Cast", label: "The Bug (pink)", tags: ["bug", "defect", "glitch", "cast"], call: 'L.put(S, "sd-bug", x, feet, { s: 1, mood: "smug|scared", flip, t })', demo: { mood: "smug" } });
// ---------- Stacky: the channel mascot (three hand-inked slabs; the ink helpers are shared with brand art via L.sdInk) ----------
let inkUid = 0;
const crPath = (pts, closed) => { // Catmull-Rom through pts -> cubic path
  const n = pts.length, g = (i) => (closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d + (closed ? "Z" : "");
};
const jit = (pts, a, seed) => { const r = L.rng(seed); return pts.map(([x, y]) => [x + (r() - 0.5) * 2 * a, y + (r() - 0.5) * 2 * a]); };
const rrPts = (x, y, w, h, r, step = 36) => { // points round a rounded rect (clockwise), dense enough for a wobbly hand-inked outline
  const out = [], arc = (cx, cy, a0) => { for (let k = 0; k <= 3; k++) { const a = ((a0 + k * 30) * Math.PI) / 180; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  const seg = (a, b) => { const n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step)); for (let i = 1; i < n; i++) out.push([a[0] + ((b[0] - a[0]) * i) / n, a[1] + ((b[1] - a[1]) * i) / n]); };
  arc(x + r, y + r, 180); seg([x + r, y], [x + w - r, y]);
  arc(x + w - r, y + r, 270); seg([x + w, y + r], [x + w, y + h - r]);
  arc(x + w - r, y + h - r, 0); seg([x + w - r, y + h], [x + r, y + h]);
  arc(x + r, y + h - r, 90); seg([x, y + h - r], [x, y + r]);
  return out;
};
const wobRR = (x, y, w, h, r, seed, amp = 1.6) => crPath(jit(rrPts(x, y, w, h, r), amp, seed), true);
const inkS = (d, w = 7, c = C.ink) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fillP = (d, c, op = 1) => `<path d="${d}" fill="${c}"${op < 1 ? ` fill-opacity="${op}"` : ""}/>`;
const slab = (cx, cy, w, h, c, seed, rot = 0) => { // one fat rounded slab: fill, darker underside, gloss, ink outline
  const id = "sdsl" + inkUid++, d = wobRR(cx - w / 2, cy - h / 2, w, h, Math.min(26, h * 0.4), seed);
  return L.g(`<clipPath id="${id}"><path d="${d}"/></clipPath>` + fillP(d, c)
    + `<g clip-path="url(#${id})"><rect x="${f1(cx - w / 2)}" y="${f1(cy + h * 0.2)}" width="${w}" height="${h}" fill="#000" fill-opacity="0.17"/></g>`
    + inkS(d) + inkS(`M${f1(cx - w / 2 + 24)} ${f1(cy - h / 2 + 14)} h${f1(w * 0.2)}`, 5, "rgba(255,255,255,0.6)"), rot ? `rotate(${rot} ${f1(cx)} ${f1(cy)})` : "");
};
const eyeInk = (x, y, r, dx = 0, dy = 0) => `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r)}" ry="${f1(r * 1.12)}" fill="#fff" stroke="${C.ink}" stroke-width="5.5"/>`
  + `<circle cx="${f1(x + dx)}" cy="${f1(y + dy)}" r="${f1(r * 0.5)}" fill="${C.ink}"/><circle cx="${f1(x + dx - r * 0.16)}" cy="${f1(y + dy - r * 0.2)}" r="${f1(r * 0.17)}" fill="#fff"/>`;
const pencilInk = (len = 150, th) => { // hand-inked pencil, tip at the origin, body along +x
  const h = th || Math.max(13, len * 0.085), a = len * 0.2, b = len * 0.86, e = len * 0.93;
  const J = (d, fill) => fillP(d, fill) + inkS(d, Math.max(5, h * 0.4));
  return J(`M0 0 L${f1(a)} ${f1(-h)} L${f1(a)} ${f1(h)}Z`, C.paper) + fillP(`M0 0 L${f1(a * 0.36)} ${f1(-h * 0.36)} L${f1(a * 0.36)} ${f1(h * 0.36)}Z`, C.ink)
    + J(`M${f1(a)} ${f1(-h)} H${f1(b)} V${f1(h)} H${f1(a)}Z`, C.yellow) + inkS(`M${f1(a + 4)} ${f1(-h * 0.3)} H${f1(b)} M${f1(a + 4)} ${f1(h * 0.34)} H${f1(b)}`, Math.max(2.5, h * 0.18), "rgba(29,27,31,0.45)")
    + J(`M${f1(b)} ${f1(-h)} H${f1(e)} V${f1(h)} H${f1(b)}Z`, C.gray) + J(wobRR(e, -h, len - e, h * 2, h * 0.7, 7, 0.4), C.pink);
};
const spark = (x, y, r, c, rot = 0) => L.g(inkS(`M${-r} 0 H${r} M0 ${-r} V${r}`, 6, C.ink) + inkS(`M${-r} 0 H${r} M0 ${-r} V${r}`, 3.2, c), `translate(${f1(x)} ${f1(y)}) rotate(${rot})`);

const stackyFace = (face, tx, ty, look) => {

  const grin = (o = 0) => fillP(`M${tx - 34} ${ty + 20} Q${tx} ${ty + 26} ${tx + 34} ${ty + 20} Q${tx + 30} ${ty + 54 + o} ${tx} ${ty + 56 + o} Q${tx - 30} ${ty + 54 + o} ${tx - 34} ${ty + 20}Z`, C.ink)
    + fillP(`M${tx - 14} ${ty + 46 + o} a14 9 0 0 1 28 0 a14 9 0 0 1 -28 0Z`, C.pink) + fillP(`M${tx - 26} ${ty + 20} H${tx + 26} V${ty + 28} Q${tx} ${ty + 33} ${tx - 26} ${ty + 28}Z`, "#fff")
    + inkS(`M${tx - 34} ${ty + 20} Q${tx} ${ty + 26} ${tx + 34} ${ty + 20} Q${tx + 30} ${ty + 54 + o} ${tx} ${ty + 56 + o} Q${tx - 30} ${ty + 54 + o} ${tx - 34} ${ty + 20}Z`, 5.5);
  const E = (r = 21, dy = -8) => eyeInk(tx - 36, ty + dy, r, lx, ly) + eyeInk(tx + 36, ty + dy, r, lx, ly);
  switch (face) {
    case "wow": return E(24, -10) + brow(tx - 36, ty - 44, 5) + brow(tx + 36, ty - 44, -5) + fillP(`M${tx - 14} ${ty + 30} a14 18 0 1 0 28 0 a14 18 0 1 0 -28 0Z`, C.ink) + inkS(`M${tx - 14} ${ty + 30} a14 18 0 1 0 28 0 a14 18 0 1 0 -28 0Z`, 5);
    case "smug": return eyeInk(tx - 36, ty - 6, 21, lx, ly + 3) + eyeInk(tx + 36, ty - 6, 21, lx, ly + 3)
      + [-36, 36].map((o) => fillP(`M${tx + o - 24} ${ty - 6} A24 24 0 0 1 ${tx + o + 24} ${ty - 6}Z`, C.lime) + inkS(`M${tx + o - 25} ${ty - 6} H${tx + o + 25}`, 5.5)).join("")

    const label = o.label ? L.text(o.label === true ? v.title : o.label, 0, o.tile ? 130 : 105, { size: 44, c: o.labelC || "ink" }) : "";
    return tile + mark + label;
  }, { box: [-110, -110, 220, 270], group: "Logos", label: v.title, tags: [slug, v.title.toLowerCase(), "logo", "brand"],
    call: `L.put(S, "logo-${slug}", x, y, { s: 1, t, tile: true|"dark", label: true, labelC: "white", mono })`, demo: { tile: true, label: true } });
})();

// ===================== episode 03 (Binance hack) kit: call tiles, the ladder, the power-of-attorney paper =====================
// Same palette as tools/sd-kit.js. Drawn with L.* primitives; no real logos or real people (tiles are generic doodle heads).
(function () {
const L = window.L, f1 = L.f1;
const C = { bg: "#15171c", panel: "#242831", paper: "#f4f1e8", paper2: "#e3dece", lime: "#b6f24a", pink: "#ff4d8d", cyan: "#4cc9f0", yellow: "#ffd23f", ink: "#1d1b1f", ink2: "#3a363d", gray: "#8b909a", white: "#ffffff" };
const col = (n) => C[n] || n;
const shadow = (d, dx = 9, dy = 12, op = 0.5) => L.g(L.flat(d, "#000000", op), `translate(${dx} ${dy})`);
const stamp = (txt, w, c, rot = -12, size = 64) => L.g(L.stroke(L.rrect(-w / 2, -size * 0.75, w, size * 1.5, 14), { c, w: 8 })
  + L.text(txt, 0, size * 0.36, { size, c, font: "Mono", weight: 800, spacing: 4 }), `rotate(${rot})`);

// video-call tile: dark panel, a generic doodle head, a name bar; fake: pink FAKE stamp
L.reg("sd", "b3-tile", (o) => {
  const w = o.w || 460, h = o.h || 330, x0 = -w / 2, y0 = -h / 2, hc = col(o.hc || "cyan");
  let s = shadow(L.rrect(x0, y0, w, h, 24)) + L.shape(L.rrect(x0, y0, w, h, 24), C.panel, { flat: true, c: "#3a404c", w: 5 });
  s += L.shape(`M${f1(-w * 0.26)} ${f1(y0 + h - 4)} Q${f1(-w * 0.26)} ${f1(h * 0.05)} 0 ${f1(h * 0.05)} Q${f1(w * 0.26)} ${f1(h * 0.05)} ${f1(w * 0.26)} ${f1(y0 + h - 4)} Z`, hc, { flat: true });
  s += L.shape(L.circ(0, -h * 0.12, h * 0.2), "#f0c9a0", { flat: true });
  s += L.flat(L.circ(-h * 0.07, -h * 0.14, 6), C.ink) + L.flat(L.circ(h * 0.07, -h * 0.14, 6), C.ink);
  s += L.stroke(`M${f1(-h * 0.07)} ${f1(-h * 0.04)} Q0 ${f1(h * 0.02)} ${f1(h * 0.07)} ${f1(-h * 0.04)}`, { c: C.ink, w: 5 });
  s += L.flat(L.rrect(x0 + 16, y0 + h - 62, Math.min(w - 32, 40 + String(o.name || "").length * 24), 46, 10), "#000000", 0.55);
  s += L.text(o.name || "HR", x0 + 34, y0 + h - 29, { size: 30, c: C.white, font: "Mono", weight: 700, anchor: "start" });
  if (o.badge) s += L.flat(L.circ(x0 + w - 34, y0 + 34, 12), C.lime);
  if (o.fake) s += L.g(stamp("FAKE", 260, C.pink, -12, 72), `translate(0 ${f1(-h * 0.08)})`);
  return s;
}, { box: [-240, -175, 480, 350], group: "Episode", label: "Video-call tile", tags: ["call", "interview", "tile"],
  call: 'L.put(S, "b3-tile", x, y, { name: "HR", hc: "cyan", fake: false, badge: true, w: 460, h: 330, t, slide })' });

// the escalation ladder: n rungs, the first `lit` glow lime with labels to the right (rung 1 = bottom)
L.reg("sd", "b3-ladder", (o) => {
  const n = o.n || 4, h = o.h || 680, rw = 150, labels = o.labels || [], lit = o.lit || 0;
  let s = L.stroke(`M${-rw / 2} ${h / 2 + 30}V${-h / 2 - 30}M${rw / 2} ${h / 2 + 30}V${-h / 2 - 30}`, { c: "#5a606c", w: 14 });
  for (let i = 0; i < n; i++) {
    const y = h / 2 - (i + 0.5) * (h / n), on = i < lit;
    s += L.stroke(`M${-rw / 2} ${f1(y)}H${rw / 2}`, { c: on ? C.lime : "#3a404c", w: 16 });
    if (on && labels[i]) s += L.text(labels[i], rw / 2 + 36, y + 14, { size: o.size || 40, c: i === lit - 1 ? C.lime : C.gray, font: "Mono", weight: 800, anchor: "start" });
  }
  return s;
}, { box: [-90, -370, 900, 740], group: "Episode", label: "Escalation ladder", tags: ["ladder", "steps"],
  call: 'L.put(S, "b3-ladder", x, y, { n: 4, lit: 2, labels: ["A LIST OF NAMES", …], h: 680, size: 40, t })' });

// a paper: title, ruled lines, a wax seal; stamp: diagonal word (REVOKED / CLOSED)
L.reg("sd", "b3-paper", (o) => {
  const w = o.w || 520, h = o.h || 640, x0 = -w / 2, y0 = -h / 2, sc = col(o.seal || "pink");
  let s = shadow(L.rrect(x0, y0, w, h, 14)) + L.shape(L.rrect(x0, y0, w, h, 14), C.paper, { flat: true });
  String(o.title || "POWER OF|ATTORNEY").split("|").forEach((ln, i) => (s += L.text(ln, 0, y0 + 92 + i * 58, { size: o.tsize || 50, c: C.ink, font: "Mono", weight: 800 })));
  for (let i = 0; i < 5; i++) s += L.stroke(L.line([x0 + 50, y0 + h * (0.4 + i * 0.085)], [x0 + w - 50 - (i === 4 ? w * 0.4 : 0), y0 + h * (0.4 + i * 0.085)]), { c: C.gray, w: 6 });
  if (o.to) s += L.text(o.to, x0 + 50, y0 + h * 0.4 - 26, { size: 28, c: C.ink2, font: "Mono", weight: 700, anchor: "start" });
  s += L.shape(L.star(x0 + w - 92, y0 + h - 92, 58, 50, 16, -90), sc, { flat: true }) + L.stroke(L.circ(x0 + w - 92, y0 + h - 92, 36), { c: "#00000055", w: 4 });
  s += L.stroke(`M${x0 + 50} ${y0 + h - 80} q40 -40 70 0 t70 0 t60 -10`, { c: C.ink, w: 5 });
  if (o.stamp) s += L.g(stamp(o.stamp, w * 0.8, col(o.stampC || "pink"), -14, 76), `translate(0 ${f1(h * 0.05)})`);
  return s;
}, { box: [-260, -320, 520, 640], group: "Episode", label: "Document with seal", tags: ["paper", "document", "attorney"],
  call: 'L.put(S, "b3-paper", x, y, { title: "POWER OF|ATTORNEY", to: "TO: CONTRACT 0x…", seal: "pink", stamp: "REVOKED", t, slide })' });

// one MPC key share: a key bow + a fraction of the blade, numbered
L.reg("sd", "b3-share", (o) => {
  const c = col(o.c || "yellow");
  let s = L.shape(L.circ(-60, 0, 42), c, { flat: true }) + L.flat(L.circ(-60, 0, 16), C.bg);
  s += L.shape(L.rrect(-22, -12, 110, 24, 6), c, { flat: true }) + L.shape(L.rect(60, 10, 16, 26), c, { flat: true });
  s += L.text(o.label || "1/3", 0, 92, { size: 34, c: C.white, font: "Mono", weight: 800 });
  return s;
}, { box: [-110, -60, 220, 170], group: "Episode", label: "Key share", tags: ["key", "share", "mpc"],
  call: 'L.put(S, "b3-share", x, y, { label: "1/3", c: "yellow", t, pop })' });
})();

// B (object hero): a laptop on a video call, the interviewer tile stamped FAKE; crypto coins (XRP, SOL, BTC, ETH) pour out of

const S = scene(0, 1, { cam: "none" });

L.reg("sdt", "b-bg", () => `<defs>
  <radialGradient id="bg1" cx="62%" cy="48%" r="58%"><stop offset="0" stop-color="#ff2f6d" stop-opacity="0.95"/><stop offset="0.4" stop-color="#5a0f33" stop-opacity="0.5"/><stop offset="1" stop-color="${P.bg}" stop-opacity="0"/></radialGradient>
  <radialGradient id="bvig" cx="50%" cy="50%" r="75%"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></radialGradient></defs>
  <rect width="1920" height="1080" fill="${P.bg}"/><rect width="1920" height="1080" fill="url(#bg1)"/>
  ${Array.from({ length: 33 }, (_, i) => `<path d="M${i * 60} 0V1080" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>`).join("")}
  ${Array.from({ length: 19 }, (_, i) => `<path d="M0 ${i * 60}H1920" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>`).join("")}
  <rect width="1920" height="1080" fill="url(#bvig)"/>`, { box: [0, 0, 1920, 1080] });
L.reg("sdt", "b-laptop", () => `<path d="M-560 330 H560 L660 420 H-660 Z" fill="#9aa3b0" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
  <rect x="-520" y="-370" width="1040" height="700" rx="36" fill="#2b3038" stroke="#000" stroke-width="12"/>
  <rect x="-480" y="-330" width="960" height="620" rx="14" fill="#1a2233"/>`, { box: [-680, -390, 1360, 830] });
L.reg("sdt", "b-words", () => {
  const word = (str, x, y, size, c, rot) => `<g transform="rotate(${rot} ${x} ${y})">
    <text x="${x + 12}" y="${y + 16}" font-family="'Mono'" font-weight="800" font-size="${size}" fill="#000" opacity="0.55">${str}</text>
    <text x="${x}" y="${y}" font-family="'Mono'" font-weight="800" font-size="${size}" fill="${c}" stroke="#0b0910" stroke-width="${size * 0.11}" paint-order="stroke" stroke-linejoin="round">${str}</text></g>`;
  return word("$6.3B", 60, 260, 230, P.cream, -4) + word("JOB", 70, 470, 210, P.pink, -4) + word("OFFER", 70, 650, 170, P.pink, -4);
}, { box: [0, 0, 1920, 1080] });
L.put(S, "b-bg", 0, 0, {});
L.put(S, "b-laptop", 1180, 560, { s: 0.95, rot: 4 });
L.put(S, "b3-tile", 1180, 545, { name: "CEO", hc: "yellow", badge: true, w: 880, h: 560, rot: 4 });
L.put(S, "b3-tile", 1180, 545, { name: "CEO", hc: "yellow", w: 880, h: 560, fake: true, rot: 4, s: 1 });
[["xrp", 700, 800, 1.5, -12], ["solana", 960, 950, 1.3, 10], ["bitcoin", 1380, 930, 1.6, -6], ["ethereum", 1700, 930, 1.3, 14], ["binance", 1760, 230, 1.2, 8]].forEach(([n, x, y, s, rot]) =>
  L.put(S, "logo-" + n, x, y, { s, tile: true, rot }));
L.put(S, "b-words", 0, 0, {});
L.put(S, "sd-badge", 80, 1000, { kind: "POSTMORTEM", date: "NOV 4", s: 1.25 });
