    if ((o.kind || "grad") === "grad") S.seq([[poly([[cx - 70 * s, cy], [cx, cy - 30 * s], [cx + 70 * s, cy], [cx, cy + 30 * s], [cx - 70 * s, cy]], 1), 2, { w: 6, fill: INK }], [rect(cx - 36 * s, cy + 10 * s, 72 * s, 30 * s), 1, { w: 6, fill: INK }], [smooth([[cx, cy], [cx + 50 * s, cy + 12 * s], [cx + 58 * s, cy + 52 * s]]), 0.6, { w: 4, c: YEL }]], t, dur, g);
    else S.seq([[smooth([[cx - 95 * s, cy + 20 * s], [cx - 60 * s, cy - 30 * s], [cx, cy - 55 * s], [cx + 60 * s, cy - 30 * s], [cx + 95 * s, cy + 20 * s], [cx, cy + 8 * s], [cx - 95 * s, cy + 20 * s]]), 2, { w: 6, fill: INK }], [circ(cx, cy - 22 * s, 11 * s), 0.6, { w: 4, fill: RED }]], t, dur, g);
    return { g };
  },
  // name tag / label box with text
  tag(S, cx, cy, txt, t, dur, o = {}) {
    const g = S.grp(o.parent), size = o.size || 40, w = txt.length * size * (V3 ? 0.66 : 0.55) + 40, h = size * 1.4;
    S.draw(rrect(cx - w / 2, cy - h / 2, w, h, 10), t, dur * 0.4, { w: 5, fill: o.fill || PAPER, parent: g, c: o.c || INK });
    S.text(txt, cx, cy + size * 0.35, { size, t: t + dur * 0.4, dur: dur * 0.6, parent: g, c: o.tc || INK });
    return { g };
  },
  // checklist: items [text,...] from (x,y) downwards; returns box centres
  checklist(S, x, y, items, t, dur, o = {}) {
    const g = S.grp(o.parent), gap = o.gap || 78, size = o.size || 48, boxes = [];
    items.forEach((txt, i) => {
      const yy = y + i * gap, tt = t + (i * dur) / items.length, d = dur / items.length;
      S.draw(rect(x, yy - 24, 46, 46), tt, d * 0.35, { w: 6, parent: g });
      S.text(txt, x + 70, yy + 16, { size, anchor: "start", t: tt + d * 0.35, dur: d * 0.6, parent: g });
      boxes.push([x + 23, yy]);
    });
    return { g, boxes };
  },
  // split-screen divider (black, full height) at x
  divider(S, x = 960, t, dur = 0.01, o = {}) { return { g: S.draw(`M${x} -20 L${x} 1100`, t, dur, { w: o.w || 10, c: o.c || "#111111", parent: o.parent }) }; },
  // glowing rays burst
  burst(S, cx, cy, r1, r2, n, t, dur, o = {}) { return { g: S.draw(rays(cx, cy, r1, r2, n, o.a0 || 0, o.span || Math.PI * 2), t, dur, { w: o.w || 6, c: o.c || INK, parent: o.parent }) }; },
};

// ---------- captions (bottom line, word-by-word reveal) ----------
function captions(CH) {
  const capsEl = document.getElementById("caps");
  CH.forEach((ch, i) => {
    const ws = ch.slice(0, -1), clipEnd = ch[ch.length - 1];
    const d = document.createElement("div");
    d.className = "cap";
    ws.forEach((w) => {
      const sp = document.createElement("span");
      sp.textContent = w[0];
      d.appendChild(sp);
      tl.to(sp, { opacity: 1, duration: 0.08 }, w[1]);
    });
    capsEl.appendChild(d);
    const t0 = ws[0][1] - 0.05, nxt = CH[i + 1];
    const t1 = nxt && nxt[0][1] - ws[ws.length - 1][2] < 1.2 ? nxt[0][1] - 0.05 : clipEnd + 0.4;
    tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
    tl.to(d, { opacity: 0, duration: 0.2 }, Math.min(t1, TOTAL) - 0.2);
  });
}

// ===================== kit.js — design system for `// look: still` =====================
// Every colour, width, radius, size and gap in a still scene comes from DS (rules + reasons: references/style-guide.md).
// scene_lint.py fails raw hex colours / widths / radii in scenes.js, so scenes stay on-system.

const DS = {
  // palette: [base, light (lit side), dark (shade side)]. Light comes from the top-left.
  P: {
    ink: ["#1d1b1f", "#3a363d", "#000000"], paper: ["#fbf7ef", "#ffffff", "#ece4d4"], white: ["#ffffff", "#ffffff", "#e9e4dc"],
    sky: ["#a9dcf5", "#d6f0fc", "#7cc3ea"], night: ["#2f4a86", "#48649f", "#1c2f5c"], dusk: ["#f6c9a8", "#fbe3cf", "#e3a27c"],
    grass: ["#7cc576", "#a3db8e", "#4f9a48"], earth: ["#d9a86c", "#ecc896", "#b07a43"], sand: ["#ecd49e", "#f6e7c4", "#cfb173"],
    wall: ["#f3e2c4", "#fbf0dc", "#e0c79f"], floor: ["#c8976a", "#dbb58e", "#9c6f48"], wood: ["#b08968", "#cfa888", "#7f5f45"],
    blue: ["#2f6fd6", "#6d9ee8", "#1f4fa3"], navy: ["#1f2a44", "#3a4a6e", "#121a2e"], purple: ["#8e5bb5", "#b48ad6", "#67408a"],
    green: ["#3f9e4a", "#6fc078", "#2c7536"], red: ["#e5383b", "#f2787a", "#b02225"], orange: ["#ff8c1a", "#ffb466", "#d06a00"],
    yellow: ["#ffcf33", "#ffe38a", "#e0a800"], pink: ["#f28ca0", "#f7b6c3", "#d0607a"], gray: ["#9aa0a6", "#c4c8cc", "#6f757b"],
    brown: ["#5a3825", "#7a5236", "#3d2418"], gold: ["#f2b84b", "#f8d58f", "#c98e1c"], glass: ["#dff3ff", "#ffffff", "#b9def5"],
  },
  w: { hair: 2, detail: 3, far: 3, mid: 5, near: 7 },          // stroke px. far < mid < near = depth
  r: { xs: 6, sm: 12, md: 20, lg: 32 },                         // corner radii
  type: { caption: 40, small: 52, body: 64, title: 84, display: 110 }, // text px
  sp: (n) => 8 * n,                                              // spacing grid: 8 px
  safe: { x0: 96, x1: 1824, y0: 64, y1: 940 },                   // keep content inside; captions live below 980
  // depth planes: scale for figures/props, haze = how far the colour moves toward the sky (atmospheric perspective)
  depth: { far: { s: 0.55, haze: 0.45, w: "far" }, mid: { s: 0.8, haze: 0.18, w: "mid" }, near: { s: 1, haze: 0, w: "near" } },
  hazeTo: "#e4f3fb",                                             // scene sky-light; set per scene with DS.setHaze()
};

DS.mix = (a, b, k) => { const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); const A = h(a), B = h(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); };
DS.lum = (c) => { const v = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4)); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
DS.contrast = (a, b) => { const [x, y] = [DS.lum(a), DS.lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
DS.setHaze = (name) => (DS.hazeTo = DS.P[name] ? DS.P[name][1] : name);
// colour by name, tone (0 base, 1 light, 2 dark) and depth layer
DS.c = (name, tone = 0, layer = "near") => DS.mix(DS.P[name][tone], DS.hazeTo, DS.depth[layer].haze);
DS.line = (layer = "near") => DS.mix(DS.P.ink[0], DS.hazeTo, DS.depth[layer].haze * 1.3); // far outlines fade too

let DSN = 0;
const dsDefs = () => document.querySelector("#stage defs");
// diagonal light→dark gradient = volume (key light top-left). Returns "url(#id)".
DS.vol = (name, layer = "near", dir = "diag") => {
  const id = `ds-${name}-${layer}-${dir}`;
  if (!document.getElementById(id)) {
    const [x2, y2] = dir === "v" ? [0, 1] : dir === "h" ? [1, 0] : [1, 1];
    const g = el("linearGradient", { id, x1: 0, y1: 0, x2, y2 }, dsDefs());
    [[0, 1], [0.55, 0], [1, 2]].forEach(([o, tone]) => el("stop", { offset: o, "stop-color": DS.c(name, tone, layer) }, g));
  }
  return `url(#${id})`;
};
DS.vgrad = (top, bottom) => { const id = "ds-vg" + ++DSN, g = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, dsDefs()); el("stop", { offset: 0, "stop-color": top }, g); el("stop", { offset: 1, "stop-color": bottom }, g); return `url(#${id})`; };
DS.glow = (color, op = 0.55) => { const id = "ds-rg" + ++DSN, g = el("radialGradient", { id }, dsDefs()); el("stop", { offset: 0, "stop-color": color, "stop-opacity": op }, g); el("stop", { offset: 1, "stop-color": color, "stop-opacity": 0 }, g); return `url(#${id})`; };

// a solid object: volume fill + outline weighted by depth. o: { layer, t, dir, tone, flat:true (no gradient), parent }
DS.shape = (S, d, name, o = {}) => {
  const layer = o.layer || "near";
  return S.draw(d, o.t ?? S.start, 0, { fill: o.flat ? DS.c(name, o.tone || 0, layer) : DS.vol(name, layer, o.dir), c: o.c || DS.line(layer), w: DS.w[o.w || DS.depth[layer].w], parent: o.parent, op: o.op });
};
// contact shadow under anything that stands on the ground (grounds it; without it things float)
DS.shadow = (S, cx, gy, w, o = {}) => S.fill(circ(cx, gy + 2, w / 2, w * 0.07), o.t ?? S.start, 0.3, DS.P.ink[0], o.op ?? 0.22, o.parent);
// soft drop shadow for cards / foreground objects: offset copy, low opacity
DS.drop = (S, d, o = {}) => S.fill(d, o.t ?? S.start, 0.3, DS.P.ink[0], 0.14, o.parent);

// label card: rounded, padded, shadowed; text always ink-on-paper (contrast ≥ 12:1) unless tc given.
DS.card = (S, str, cx, cy, o = {}) => {
  const size = o.size || DS.type.small, t = o.t ?? S.start, pad = [DS.sp(3), DS.sp(1.5)], w = str.length * size * 0.62 + pad[0] * 2, h = size * 1.15 + pad[1] * 2, g = S.grp(o.parent);
  const x = cx - w / 2, y = cy - h / 2, r = DS.r[o.r || "md"];
  S.fill(rrect(x + 4, y + 8, w, h, r), t, 0.3, DS.P.ink[0], 0.14, g);
  S.draw(rrect(x, y, w, h, r), t, 0, { fill: o.fill ? DS.c(o.fill, 1) : DS.P.white[0], c: DS.P.ink[0], w: DS.w.detail, parent: g });
  S.text(str, cx, cy + size * 0.36, { size, t, c: o.tc ? DS.c(o.tc, 2) : DS.P.ink[0], parent: g });
  if (t > S.start + 0.05) tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.35 }, t);
  return { g, w, h };
};

// ---------- scenery with depth ----------
// outdoor: gradient sky, sun glow, 3 hill planes hazed by distance, ground gradient, optional path to the horizon
DS.outdoor = (S, o = {}) => {
  const hy = o.hy || 640, sky = o.sky || "sky", g = S.grp(); S.g.insertBefore(g, S.g.firstChild);
  DS.setHaze(sky);
  const sh = (d, fill, op) => { const p = el("path", { d, fill }, g); if (op !== undefined) p.setAttribute("opacity", op); return p; };
  const box = (x0, y0, x1, y1) => `M${x0} ${y0} H${x1} V${y1} H${x0} Z`;
  sh(box(-200, -200, 2120, 1280), DS.vgrad(DS.P[sky][2], DS.P[sky][1]));
  if (o.sun !== false) { const [sx, sy] = o.sun || [1560, 200]; sh(circ(sx, sy, 300), DS.glow("#fff6d6", 0.8)); sh(circ(sx, sy, 70), "#fff6d6"); }
  const ridge = (y, amp, ph) => smooth(Array.from({ length: 9 }, (_, i) => [-200 + i * 290, y - amp * (0.5 + 0.5 * Math.sin(i * 1.3 + ph))])) + " L2120 1280 L-200 1280 Z";
  [["far", hy - 70, 70, 0.7], ["mid", hy - 25, 45, 2.2]].forEach(([L, y, a, ph]) => sh(ridge(y, a, ph), DS.c(o.hills || "grass", L === "far" ? 1 : 0, L)));
  sh(ridge(hy + 20, 14, 4.1), DS.vgrad(DS.c(o.ground || "grass", 0, "mid"), DS.c(o.ground || "grass", 2)));
  if (o.path) sh(`M${o.path[0]} 1280 L${960 - 18} ${hy + 22} L${960 + 18} ${hy + 22} L${o.path[1]} 1280 Z`, DS.vgrad(DS.c("sand", 0, "mid"), DS.c("sand", 1)));
  return { g, hy };
};
// room interior in one-point perspective: back wall, side walls, floor with converging boards, baseboard, window + light patch
DS.room = (S, o = {}) => {
  const g = S.grp(); S.g.insertBefore(g, S.g.firstChild);
  const [bx0, by0, bx1, by1] = o.back || [360, 90, 1560, 760];   // back wall rectangle; the vanishing point is its centre
  DS.setHaze("wall");
  const sh = (d, fill, op) => { const p = el("path", { d, fill }, g); if (op !== undefined) p.setAttribute("opacity", op); return p; };
  const P4 = (pts) => `M${pts.map((p) => p.join(" ")).join(" L")} Z`;
  sh(P4([[-200, -200], [bx0, by0], [bx0, by1], [-200, 1280]]), DS.vgrad(DS.c(o.wall || "wall", 2), DS.c(o.wall || "wall", 0)));       // left wall (shade side)
  sh(P4([[2120, -200], [bx1, by0], [bx1, by1], [2120, 1280]]), DS.vgrad(DS.c(o.wall || "wall", 0), DS.c(o.wall || "wall", 1)));       // right wall (lit)
  sh(P4([[-200, -200], [2120, -200], [bx1, by0], [bx0, by0]]), DS.c(o.wall || "wall", 1));                                       // ceiling
  sh(P4([[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]]), DS.vgrad(DS.c(o.wall || "wall", 1), DS.c(o.wall || "wall", 0)));          // back wall
  sh(P4([[bx0, by1], [bx1, by1], [2120, 1280], [-200, 1280]]), DS.vgrad(DS.c(o.floor || "floor", 0, "mid"), DS.c(o.floor || "floor", 2)));
  const vx = (bx0 + bx1) / 2, n = 9;
  for (let i = 1; i < n; i++) { const fx = bx0 + ((bx1 - bx0) * i) / n, ex = -200 + (2320 * i) / n; el("path", { d: `M${fx} ${by1} L${ex} 1280`, stroke: DS.c(o.floor || "floor", 2), "stroke-width": DS.w.hair, opacity: 0.5 }, g); }
  sh(P4([[bx0, by1 - 22], [bx1, by1 - 22], [bx1, by1], [bx0, by1]]), DS.c("white", 2));                                              // baseboard
  if (o.window !== false) {
    const [wx, wy, ww, wh] = o.window || [bx1 - 380, by0 + 90, 260, 300];
    sh(rrect(wx - 14, wy - 14, ww + 28, wh + 28, DS.r.xs), DS.c("white", 0)); sh(rect(wx, wy, ww, wh), DS.vgrad(DS.P.sky[1], DS.P.sky[0]));
    el("path", { d: `M${wx + ww / 2} ${wy} V${wy + wh} M${wx} ${wy + wh / 2} H${wx + ww}`, stroke: DS.c("white", 0), "stroke-width": DS.w.near }, g);
    sh(P4([[wx, by1 + 30], [wx + ww, by1 + 30], [wx + ww * 1.5 - vx * 0.0, 1080], [wx - ww * 0.3, 1080]]), "#fff6d6", 0.22);          // light patch on the floor
  }
  return { g, hy: by1, vp: [vx, (by0 + by1) / 2] };
};
// a figure placed on a depth plane: scale, stroke and a contact shadow follow the layer
DS.figure = (S, x, gy, layer = "near", o = {}) => {
  const L = DS.depth[layer], s = (o.s || 1.1) * L.s;
  DS.shadow(S, x, gy, 150 * s, { t: o.t });
  const F = S.fig(x, gy, Object.assign({ hair: "short", outfit: "tee" }, o, { s, w: DS.w[L.w] * 1.3 * Math.sqrt(s) })).draw(o.t ?? S.start, 0.4); // characters 1.3x the plane width so they pop from the set
  F.face(o.t ?? S.start, o.mood || "flat", o.look || 0);
  return F;
};

// ---------- finishing: focus, detail, foreground depth ----------
// vignette: edges 12 % darker, pulls the eye to the centre (always last, on top of the scene)
DS.vignette = (S, k = 0.12) => { const id = "ds-vig" + ++DSN, g = el("radialGradient", { id, cx: 0.5, cy: 0.5, r: 0.75 }, dsDefs()); el("stop", { offset: 0.55, "stop-color": DS.P.ink[0], "stop-opacity": 0 }, g); el("stop", { offset: 1, "stop-color": DS.P.ink[0], "stop-opacity": k }, g); return el("path", { d: "M-200 -200 H2120 V1280 H-200 Z", fill: `url(#${id})`, "pointer-events": "none" }, S.g); };
// rug in perspective under a group of people (ties them to the floor)
DS.rug = (S, cx, cy, w, name = "red") => { DS.shape(S, circ(cx, cy, w / 2, w * 0.13), name, { layer: "mid", flat: true, w: "detail" }); S.draw(circ(cx, cy, w * 0.42, w * 0.1), S.start, 0, { c: DS.c(name, 1, "mid"), w: DS.w.detail }); };
// framed picture on a wall: detail that says "home"
DS.frame = (S, x, y, w, h, name = "sky", layer = "mid") => { DS.drop(S, rrect(x + 6, y + 8, w, h, DS.r.xs)); DS.shape(S, rrect(x, y, w, h, DS.r.xs), "wood", { layer, w: "detail" }); DS.shape(S, rect(x + 12, y + 12, w - 24, h - 24), name, { layer, w: "hair", dir: "v" }); };
// foreground plant: big, dark, cropped by the frame edge - the nearest plane, sells depth
DS.plant = (S, x, gy, k = 1, side = 1) => {
  const g = S.grp(), c = DS.c("green", 2), c2 = DS.c("green", 0);
  [[-60, -420, -0.5], [10, -470, 0.1], [70, -400, 0.6], [-20, -330, -0.2], [90, -300, 0.9]].forEach(([dx, dy, a], i) => {
    const tx = x + dx * k * side, ty = gy + dy * k;
    S.draw(smooth([[x, gy - 200 * k], [(x + tx) / 2 + 40 * a * k, (gy - 200 * k + ty) / 2], [tx, ty], [(x + tx) / 2 + 90 * a * k * side, (gy - 200 * k + ty) / 2 + 30 * k], [x, gy - 200 * k]]) + " Z", S.start, 0, { fill: i % 2 ? c : c2, c: DS.P.ink[0], w: DS.w.near, parent: g });
  });
  DS.shape(S, `M${x - 110 * k} ${gy - 220 * k} H${x + 110 * k} L${x + 85 * k} ${gy} H${x - 85 * k} Z`, "orange", { w: "near" });
  return g;
};

// shaded fill from any hex (characters): light 18 % toward white at top-left, 22 % toward ink at bottom-right
DS.volHex = (hex) => {
  const id = "ds-vh-" + hex.slice(1);
  if (!document.getElementById(id)) { const g = el("linearGradient", { id, x1: 0, y1: 0, x2: 1, y2: 1 }, dsDefs()); [[0, DS.mix(hex, "#ffffff", 0.18)], [0.5, hex], [1, DS.mix(hex, DS.P.ink[0], 0.22)]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, g)); }
  return `url(#${id})`;
};

// look: still

// ---------- IK + pose building (same maths as motion.js, kept local so this file works without it) ----------
const A1 = 58, A2 = 52, T1 = 62, T2 = 73;
const ik = (rx, ry, hx, hy, l1, l2, pref) => {
  let dx = hx - rx, dy = hy - ry, d = Math.hypot(dx, dy) || 1;
  const mx = l1 + l2 - 0.5, mn = Math.abs(l1 - l2) + 1, k = d > mx ? mx / d : d < mn ? mn / d : 1;
  dx *= k; dy *= k; d *= k;
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a)), ux = dx / d, uy = dy / d;
  const c1 = [ux * a - uy * h, uy * a + ux * h], c2 = [ux * a + uy * h, uy * a - ux * h];
  const e = c1[0] * pref[0] + c1[1] * pref[1] >= c2[0] * pref[0] + c2[1] * pref[1] ? c1 : c2;
  return [e.map(r1), [dx, dy].map(r1)];
};
const armIK = (side, rx, hand, pref) => ik(side * rx, 0, hand[0], hand[1], A1, A2, pref || [side, 0.7]);
const legIK = (foot, pref) => ik(0, 0, foot[0], foot[1], T1, T2, pref || [foot[0] < 0 ? -0.5 : 0.5, 0.3]);
const armT = (side, t1, t2) => { const e = [side * A1 * sin(t1), A1 * cos(t1)]; return [e, [e[0] + side * A2 * sin(t2), e[1] + A2 * cos(t2)]].map((p) => p.map(r1)); };
const legT = (off, t1, t2) => { const k = [off + T1 * sin(t1), T1 * cos(t1)]; return [k, [k[0] + T2 * sin(t2), k[1] + T2 * cos(t2)]].map((p) => p.map(r1)); };
const XF = {}; // pose name -> { rot, drop, dx, dy, planted }
const GEO = {};
// geometry of a style (in s = 1 units, relative to the arm-root centre C = (0, shoulder line + 16)): used to aim hands at the mouth / eyes / head
const geoOf = (st, body) => {
  const key = st + "|" + (body || ""); if (GEO[key]) return GEO[key];
  const a = L.anchors({ style: st, body, pose: "stand" }), s = a.s, cy = a.abL[1], R = a.R / s, hy = (a.hd[1] - cy) / s;
  return (GEO[key] = { R, rx: a.abR[0] / s, hd: [0, hy], m: [0, hy + 0.45 * R], e: [0, hy - 0.08 * R], chin: [0, hy + R], top: [0, hy - R], hip: [0, (a.hip[1] - cy) / s] });
};
const T_ = (t, g) => (typeof t === "function" ? t(g) : t);
const defPose = (name, p, g) => {
  const xf = p.xf || {}, pl = xf.planted === true ? [true, true] : [].concat(xf.planted || []), STAND = L.POSES.stand;
  L.POSES[name] = [p.al ? armT(...p.al) : p.l ? armIK(-1, g.rx, T_(p.l, g), p.pl) : STAND[0], p.ar ? armT(...p.ar) : p.r ? armIK(1, g.rx, T_(p.r, g), p.pr) : STAND[1]];
  if (p.ll || p.rl || p.lt || p.rt) {
    const one = (i, tgt, ang, pref, def) => {
      if (ang) return legT(...ang);
      let f = tgt || def, pr = pref;
      if (pl[i] && xf.rot) { f = rot2(f, -xf.rot); pr = pr && rot2(pr, -xf.rot); }
      return legIK(f, pr);
    };
    L.POSE_LEGS[name] = [one(0, p.ll, p.lt, p.kl, [-35, 130]), one(1, p.rl, p.rt, p.kr, [35, 130])];
  }
  XF[name] = xf;
  return name;
};

      + [].concat(po_.acc || []).map((n) => (ACC[n] ? ACC[n].draw(Object.assign({}, A, { hd: hp }), po_) : "")).join("")
      + L.face(hp[0], hp[1], R, po_.face, { eyes: (L.CAST[st] || L.CAST.man01).eyes, look: po_.look, olK: 1, skinName: skin });

// Poses are built from hand/foot TARGETS (2-bone IK, body space) so they keep proportions on every cast style.

  zoom: { cam: "zoom", from: 1, to: 1.25, dur: 0.8, ease: "power2.out" }, crossfade: { dur: 0.6 }, cut: { dur: 0 },
};
const mini = (x, y, w, h, night) => L.flat(L.rect(x, y, w, h), night ? "night" : "sky") + L.flat(L.rect(x, y + h * 0.66, w, h * 0.34), night ? "navy" : "grass") + L.flat(L.circ(x + w * 0.78, y + h * 0.26, h * 0.12), night ? "cream" : "yellow") + L.flat(L.poly([[x + w * 0.14, y + h * 0.66], [x + w * 0.3, y + h * 0.36], [x + w * 0.46, y + h * 0.66]], true), night ? "navy" : "green");
const outl = (x, y, w, h, o = {}) => L.stroke(L.rect(x, y, w, h), { c: o.c || "ink", w: o.w || "prop", dash: o.dash });
const arrow = (a, b, c = "red") => { const an = Math.atan2(b[1] - a[1], b[0] - a[0]), h = (d) => [b[0] - 18 * Math.cos(an + d), b[1] - 18 * Math.sin(an + d)]; return L.stroke(L.line(a, b), { c, w: "prop" }) + L.stroke(L.poly([h(0.5), b, h(-0.5)]), { c, w: "prop" }); };

const CAMS = {

  "cam-pan-right": ["Pan right", "move the frame ~60 px", () => mini(-150, -80, 340, 150) + outl(-150, -80, 220, 150, { c: "gray", dash: "8 8" }) + outl(-40, -80, 220, 150) + arrow([-120, 90], [90, 90], "red")],
  "cam-pan-left": ["Pan left", "move the frame ~60 px", () => mini(-190, -80, 340, 150) + outl(-70, -80, 220, 150, { c: "gray", dash: "8 8" }) + outl(-180, -80, 220, 150) + arrow([120, 90], [-90, 90], "red")],
  "cam-tilt-up": ["Tilt up", "move the frame up ~40 px", () => mini(-100, -110, 200, 170) + outl(-100, -50, 200, 110, { c: "gray", dash: "8 8" }) + outl(-100, -110, 200, 110) + arrow([140, 50], [140, -80], "red")],
  "cam-zoom-punch": ["Zoom punch", "1.00 → 1.25 in 0.8 s", () => mini(-150, -90, 300, 170) + outl(-150, -90, 300, 170, { c: "gray", dash: "8 8" }) + outl(-60, -40, 120, 68) + [[-150, -90, -66, -44], [150, -90, 66, -44], [-150, 80, -66, 34], [150, 80, 66, 34]].map(([a, b, c, d]) => arrow([a, b], [c, d])).join("")],

};

// ===================== library/props-more.js — more props, pictograms and small scenery (category "props2") =====================
// Floating props: origin = centre (~170 px across). Standing things (stand: true): origin = bottom centre on the ground.
// Every asset: L.put(S, "p2-<name>", x, y, { s, t, ...options }). Options: color (palette name), open, full, level, etc. (see each call line).
(function () {
const L = window.L, f1 = L.f1;
const sh = L.shape, st = L.stroke, fl = L.flat, rr = L.rrect, ci = L.circ, po = L.poly, sm = L.smooth, g = L.g;
const A = (...a) => a.join(""), D = { w: "detail" };
const gl = (d, op = 0.5) => fl(d, "white", op);   // glint
const dk = (d, op = 0.16) => fl(d, "ink", op);    // soft shade
const eo = (s) => s.replace("<path ", '<path fill-rule="evenodd" '); // even-odd: real holes
const ring = (cx, cy, R, r, c, o) => eo(sh(ci(cx, cy, R) + ci(cx, cy, r), c, o));
const dot = (x, y, r, c, o) => sh(ci(x, y, r), c, o);
const ln = (a, b, o) => st(L.line(a, b), o || D);
const pick = (o, k, d) => (o[k] === undefined ? d : o[k]);
const col = (o, d) => (L.BASE[o.color] ? o.color : d);
const deg = (a) => (a * Math.PI) / 180;
const ngon = (cx, cy, r, n, a0 = -90) => po(Array.from({ length: n }, (_, i) => [cx + r * Math.cos(deg(a0 + (360 * i) / n)), cy + r * Math.sin(deg(a0 + (360 * i) / n))]), true);
// a thick line with the look's outline around it (handles, cords, stems)
const tube = (d, c, w = 8) => {
  const oc = L.outline(c), base = { d, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" };
  return (oc === "none" ? "" : L.tag("path", Object.assign({ stroke: oc, "stroke-width": w + 2 * L.lw("detail") }, base))) + L.tag("path", Object.assign({ stroke: L.c(c), "stroke-width": w }, base));
};
// solid fill + features clipped inside + outline on top
const solid = (d, c, inner = "", o = {}) => {
  const id = "p2c" + (L._n = (L._n || 0) + 1), ol = o.oc || L.outline(c);
  return L.tag("path", { d, fill: L.paint(c, o) }) + (inner ? `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${inner}</g>` : "") +
    (ol === "none" ? "" : L.tag("path", { d, fill: "none", stroke: ol, "stroke-width": L.lw(o.w || "prop", o.s || 1), "stroke-linejoin": L.T.join, "stroke-linecap": L.T.cap }));
};
const clipTo = (d, inner) => { const id = "p2c" + (L._n = (L._n || 0) + 1); return `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

const steam = (x, y) => st(sm([[x, y], [x - 8, y - 14], [x + 8, y - 28], [x, y - 42]]), { c: "gray", w: 5, op: 0.55 });
const reg = (group, name, label, fn, meta = {}) => {
  const { tags = [], stand, demo, ...rest } = meta;
  const opts = Object.entries(demo || {}).map(([k, v]) => `, ${k}: ${JSON.stringify(v)}`).join("");
  L.reg("props2", "p2-" + name, fn, Object.assign({ group, label, demo: demo || {}, tags: [label.toLowerCase(), group.toLowerCase(), ...tags],
    box: stand ? [-120, -215, 240, 235] : [-110, -110, 220, 220], call: `L.put(S, "p2-${name}", x, y, { s: 1${opts}, t })` }, rest));
};
// the same prop under several option sets: one gallery tile each
const variants = (group, name, label, fn, list, meta = {}) => list.forEach(([key, demo, lab]) => reg(group, name + "-" + key, label + " · " + (lab || key), fn, Object.assign({}, meta, { demo })));

// ===================== library/text.js — cards, bubbles, captions, charts, arrows, marks, stamps, thumbnail text =====================
// Every item takes its words from o.text (and o.sub / o.value / o.data …) so it is reusable with any wording.
// The font comes from the Look token (L.T.font); colours are palette names; sizes are px at s = 1 in a 1920x1080 frame.
(function () {
const L = window.L, f1 = L.f1;

// ---------- helpers ----------
const wrap = (s, n) => { const out = []; let cur = ""; String(s).split(/\s+/).forEach((w) => { if (cur && (cur + " " + w).length > n) { out.push(cur); cur = w; } else cur = cur ? cur + " " + w : w; }); if (cur) out.push(cur); return out; };
const tw = (s, size, k = 0.6) => String(s).length * size * k;              // text width estimate
const txt = (s, x, cy, o = {}) => L.text(s, x, cy + (o.size || 64) * 0.34, o); // text centred vertically on cy
const edge = () => (L.T.ink === "none" ? L.c("gray") : L.outline("white"));    // outline colour for white shapes
const ol = (d, w = "prop", dash) => L.stroke(d, { c: edge(), w, dash });
const inked = (d, c, w) => L.stroke(d, { c: L.outline(c), w: w + 2 * L.lw("detail") }) + L.stroke(d, { c, w }); // coloured stroke with an ink edge
const wave = (x, y, w, a, n = 8) => L.smooth(Array.from({ length: n + 1 }, (_, i) => [x + (w * i) / n, y + (i % 2 ? a : -a)]));
const rot = (inner, deg, x = 0, y = 0) => L.g(inner, `translate(${f1(x)} ${f1(y)}) rotate(${deg})`);
const union = (ds, name, tone = 0, w = "prop") => { // merged blob outline: fat stroke under, fills over
  const oc = L.outline(name), sw = L.lw(w) * 2, fill = L.c(name, tone);
  return (sw ? ds.map((d) => L.tag("path", { d, fill, stroke: oc, "stroke-width": sw, "stroke-linejoin": "round" })).join("") : "") + ds.map((d) => L.tag("path", { d, fill })).join("");
};
const tri = (p, q, size) => { const dx = q[0] - p[0], dy = q[1] - p[1], m = Math.hypot(dx, dy) || 1, ux = dx / m, uy = dy / m, bx = q[0] - ux * size * 0.5, by = q[1] - uy * size * 0.5; return L.poly([[q[0] + ux * size * 0.5, q[1] + uy * size * 0.5], [bx - uy * size * 0.6, by + ux * size * 0.6], [bx + uy * size * 0.6, by - ux * size * 0.6]], true); };
const R = (group, name, label, fn, m = {}) => L.reg("text", name, fn, {
  group, label, box: m.box || [-420, -180, 840, 360], tags: m.tags || [], demo: m.demo || {}, wide: m.wide,
  call: `L.put(S, "${name}", x, y, { s, t${m.opts ? ", " + m.opts : ""} })`,
});

// ================= Cards =================
R("Cards", "title-plain", "Title · plain + squiggle", (o) => { const t = o.text || "Big Title", s = o.size || 130, w = tw(t, s);
  return txt(t, 0, 0, { size: s }) + L.stroke(wave(-w / 2, s * 0.62, w, s * 0.06), { c: o.c || "red", w: "prop" }); },
  { box: [-520, -130, 1040, 260], demo: { text: "Big Title" }, opts: 'text: "Big Title", size, c', tags: ["title", "card"], wide: true });

const lay = (o, size, n) => { const lines = wrap(o.text || "Hello there!", o.wrap || n), s = o.size || size, lh = s * 1.2; return { lines, s, lh, w: Math.max(...lines.map((l) => tw(l, s))), h: lines.length * lh }; };
const words = (m, x = 0, y0 = 0, c = "ink") => m.lines.map((l, i) => txt(l, x, y0 + (i - (m.lines.length - 1) / 2) * m.lh, { size: m.s, c })).join("");
// bubble tail: filled wedge that hides the body outline at its base + two outlined sides
const tail = (x1, y1, tip, x2, y2, fill = "white") => L.flat(L.poly([[x1, y1 - 10], [x1, y1], tip, [x2, y2], [x2, y2 - 10]], true), fill) + ol(L.poly([[x1, y1], tip, [x2, y2]]));
const bubBox = [-340, -230, 680, 460];

R("Bubbles", "bubble-round", "Speech · round", (o) => { const m = lay(o, 50, 16), rx = (m.w / 2) * 1.25 + 36, ry = (m.h / 2) * 1.3 + 30, d = o.tail === "right" ? 1 : -1;
  const ey = (x) => ry * Math.sqrt(Math.max(0, 1 - (x / rx) ** 2)), x1 = d * rx * 0.15, x2 = d * rx * 0.5;
  return L.shape(L.circ(0, 0, rx, ry), "white", { flat: true }) + tail(x1, ey(x1), [d * rx * 0.7, ry + 75], x2, ey(x2)) + words(m); },
  { box: bubBox, demo: { text: "Hello there!" }, opts: 'text, tail: "left"|"right"', tags: ["speech", "bubble", "talk"] });

R("Bubbles", "bubble-thought", "Thought · cloud", (o) => { const m = lay(o, 50, 16), rx = (m.w / 2) * 1.25 + 40, ry = (m.h / 2) * 1.3 + 34, d = o.tail === "right" ? 1 : -1, n = 12, avg = (rx + ry) / 2, br = ((2 * Math.PI * avg * 0.86) / n) * 0.62;
  const ds = [L.circ(0, 0, rx * 0.9, ry * 0.9)]; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; ds.push(L.circ(Math.cos(a) * rx * 0.88, Math.sin(a) * ry * 0.88, br)); }
  const trail = [[d * rx * 0.45, ry + 28, 24], [d * rx * 0.58, ry + 70, 16], [d * rx * 0.66, ry + 100, 10]].map(([x, y, r]) => L.shape(L.circ(x, y, r), "white", { flat: true })).join("");
  return union(ds, "white") + trail + words(m); },
  { box: bubBox, demo: { text: "I wonder..." }, opts: 'text, tail', tags: ["thought", "bubble", "think", "cloud"] });

R("Bubbles", "bubble-shout", "Shout · burst", (o) => { const m = lay(o, 56, 12), rx = (m.w / 2) * 1.35 + 60, ry = (m.h / 2) * 1.4 + 50, r = L.rng(7), n = 18;
  const pts = Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2 - Math.PI / 2, k = i % 2 ? 0.74 : 1.04 + r() * 0.1; return [Math.cos(a) * rx * k, Math.sin(a) * ry * k]; });
  return L.shape(L.poly(pts, true), o.c || "yellow", { flat: true }) + words(m, 0, 0, "ink"); },
  { box: bubBox, demo: { text: "Look out!" }, opts: 'text, c', tags: ["shout", "bubble", "burst", "yell"] });

R("Bubbles", "bubble-whisper", "Whisper · dashed", (o) => { const m = lay(o, 40, 18), rx = (m.w / 2) * 1.25 + 34, ry = (m.h / 2) * 1.3 + 28, d = o.tail === "right" ? 1 : -1;
  const ey = (x) => ry * Math.sqrt(Math.max(0, 1 - (x / rx) ** 2)), x1 = d * rx * 0.15, x2 = d * rx * 0.45, tip = [d * rx * 0.6, ry + 60];
  return L.flat(L.circ(0, 0, rx, ry), "white") + ol(L.circ(0, 0, rx, ry), "detail", "14 12") + L.flat(L.poly([[x1, ey(x1)], tip, [x2, ey(x2)]], true), "white") + ol(L.poly([[x1, ey(x1)], tip, [x2, ey(x2)]]), "detail", "10 10") + words(m, 0, 0, "gray"); },

R("Numbers and charts", "chart-pie", "Chart · pie", (o) => { const d = o.data || [40, 25, 20, 15], tot = d.reduce((a, b) => a + b, 0), r = 150; let a0 = -90, s = "";
  d.forEach((v, i) => { const a1 = a0 + (v / tot) * 360, am = ((a0 + a1) / 2) * Math.PI / 180, ex = i === 0 ? 16 : 0, ox = Math.cos(am) * ex, oy = Math.sin(am) * ex, p = (a) => [Math.cos((a * Math.PI) / 180) * r, Math.sin((a * Math.PI) / 180) * r];

    s += L.g(L.shape(`M0 0 L${f1(x0)} ${f1(y0)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f1(x1)} ${f1(y1)} Z`, COLS[i % COLS.length]) + (v / tot > 0.08 ? txt(Math.round((v / tot) * 100) + "%", Math.cos(am) * r * 0.62, Math.sin(am) * r * 0.62, { size: 38, c: "white", halo: "ink", haloW: 0.14 }) : ""), `translate(${f1(ox)} ${f1(oy)})`);

R("Numbers and charts", "chart-line", "Chart · line", (o) => { const d = o.data || [2, 3, 2.6, 5, 4.4, 7, 9], mx = Math.max(...d), W = 520, H = 280, x0 = -W / 2, y0 = 150;

// ===================== episode 08 (Gemini 4 Carbon) kit: element tiles, velvet rope, the cracked wall, the photo finish =====================
// Same palette as tools/sd-kit.js. Drawn with L.* primitives only.
(function () {
const L = window.L, f1 = L.f1;
const C = { bg: "#15171c", panel: "#242831", paper: "#f4f1e8", paper2: "#e3dece", lime: "#b6f24a", pink: "#ff4d8d", cyan: "#4cc9f0", yellow: "#ffd23f", ink: "#1d1b1f", ink2: "#3a363d", gray: "#8b909a", white: "#ffffff", brass: "#d9a441", red: "#c8324b" };
const col = (n) => C[n] || n;
const shadow = (d, dx = 9, dy = 12, op = 0.5) => L.g(L.flat(d, "#000000", op), `translate(${dx} ${dy})`);

// periodic-table tile: number top-left, big symbol, name; sleep = Zz + closed eyes; bonds = lime bond lines out to every side
L.reg("sd", "g4-elem", (o) => {
  const w = 300, c = col(o.c || "cyan");
  let s = "";
  if (o.bonds) for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + 0.2, r0 = 175, r1 = 300;
    s += L.stroke(`M${f1(Math.cos(a) * r0)} ${f1(Math.sin(a) * r0)}L${f1(Math.cos(a) * r1)} ${f1(Math.sin(a) * r1)}`, { c: C.lime, w: 12 })
      + L.shape(L.circ(Math.cos(a) * (r1 + 22), Math.sin(a) * (r1 + 22), 22), C.lime, { flat: true }); }
  s += shadow(L.rrect(-w / 2, -w / 2, w, w, 26)) + L.shape(L.rrect(-w / 2, -w / 2, w, w, 26), C.paper, { flat: true, c: c, w: 10 });
  s += L.text(String(o.num || ""), -w / 2 + 26, -w / 2 + 56, { size: 44, c: C.ink2, font: "Mono", weight: 700, anchor: "start" });
  s += L.text(o.sym || "C", 0, 52, { size: 150, c: C.ink, font: "Mono", weight: 800 });
  s += L.text(o.name || "", 0, w / 2 - 26, { size: 38, c: c === C.paper ? C.ink : C.ink2, font: "Mono", weight: 800, spacing: 3 });
  if (o.sleep) s += L.text("Zz", w / 2 - 10, -w / 2 - 10, { size: 90, c: C.cyan, font: "Mono", weight: 800, anchor: "start" });
  return s;
}, { box: [-340, -340, 680, 680], group: "Episode", label: "Element tile", tags: ["element", "periodic", "chemistry"],
  call: 'L.put(S, "g4-elem", x, y, { sym: "C", num: 6, name: "CARBON", c: "lime", sleep: false, bonds: false, t })' });

// velvet rope: two brass stanchions and a sagging red rope; optional sign hanging on it
L.reg("sd", "g4-rope", (o) => {
  const w = o.w || 700, h = 300, x0 = -w / 2, x1 = w / 2;
  const post = (x) => L.shape(L.rrect(x - 14, -h, 28, h, 10), C.brass, { flat: true, c: C.ink, w: 5 }) + L.shape(L.circ(x, -h - 18, 28), C.brass, { flat: true, c: C.ink, w: 5 })
    + L.shape(L.rrect(x - 70, -24, 140, 30, 12), C.brass, { flat: true, c: C.ink, w: 5 });
  let s = post(x0) + post(x1);
  const rope = `M${x0} ${-h + 30} Q0 ${-h + 200} ${x1} ${-h + 30}`;
  s += L.stroke(rope, { c: C.ink, w: 30 }) + L.stroke(rope, { c: C.red, w: 20 });
  if (o.sign) { const sw = Math.max(260, L.sdTw(o.sign, 40, true) + 60);
    s += L.stroke(`M-40 ${-h + 116}L-30 ${-h + 150}M40 ${-h + 116}L30 ${-h + 150}`, { c: C.ink, w: 5 })
      + shadow(L.rrect(-sw / 2, -h + 150, sw, 90, 14)) + L.shape(L.rrect(-sw / 2, -h + 150, sw, 90, 14), C.paper, { flat: true, c: C.ink, w: 6 })
      + L.text(o.sign, 0, -h + 210, { size: 40, c: C.ink, font: "Mono", weight: 800 }); }
  return s;
}, { box: [-420, -360, 840, 380], group: "Episode", label: "Velvet rope", tags: ["rope", "vip", "gate", "club"],
  call: 'L.put(S, "g4-rope", x, floorY, { w: 700, sign: "DEFENDERS ONLY", t })   // origin = floor centre' });

// a brick wall panel with a zig-zag crack; patch = a lime patch over it
L.reg("sd", "g4-wall", (o) => {
  const w = 620, h = 520;
  let s = shadow(L.rect(-w / 2, -h / 2, w, h)) + L.shape(L.rect(-w / 2, -h / 2, w, h), "#c4674a", { flat: true, c: C.ink, w: 6 });
  let d = ""; for (let r = 0; r < 8; r++) { const y = -h / 2 + r * 65; d += `M${-w / 2} ${y}H${w / 2}`; for (let x = -w / 2 + (r % 2 ? 60 : 0); x < w / 2; x += 120) d += `M${x} ${y}V${y + 65}`; }
  s += L.stroke(d, { c: "#8e4632", w: 5 });
  const crack = "M-40 -250 L-10 -170 L-60 -90 L10 -10 L-30 70 L30 150 L0 250";
  if (!o.patch) s += L.stroke(crack, { c: C.ink, w: 16 });
  else s += L.shape(L.rrect(-110, -230, 200, 460, 30), C.lime, { flat: true, c: C.ink, w: 6 }) + L.stroke("M-70 -180 L50 -180 M-70 180 L50 180", { c: C.ink, w: 5, op: 0.4 });
  return s;
}, { box: [-330, -280, 660, 560], group: "Episode", label: "Cracked wall", tags: ["wall", "crack", "bug"],
  call: 'L.put(S, "g4-wall", x, y, { patch: false, t })' });

// photo finish: a finish line and three noses (labelled chips) just at it
L.reg("sd", "g4-finish", (o) => {
  const rows = o.rows || [["CARBON 59", 0], ["OPUS 5.5 58", -22], ["GPT-6 ASTRA 57", -44]];

  for (let y = -270; y < 270; y += 36) s += L.flat(L.rect(-18, y, 18, 18), C.white) + L.flat(L.rect(0, y + 18, 18, 18), C.white);
  rows.forEach(([lab, dx], i) => { const y = -170 + i * 170, tw = L.sdTw(lab, 46, true) + 50, cc = i ? C.gray : C.lime;
    s += L.shape(L.rrect(dx - tw, y - 40, tw, 80, 40), cc, { flat: true, c: C.ink, w: 5 }) + L.text(lab, dx - tw / 2, y + 16, { size: 46, c: C.ink, font: "Mono", weight: 800 }); });
  return s;
}, { box: [-760, -280, 800, 560], group: "Episode", label: "Photo finish", tags: ["race", "finish", "ranking"],
  call: 'L.put(S, "g4-finish", x, y, { rows: [["CARBON 59", 0], ["OPUS 58", -22]], t })   // origin = the finish line' });

// a plain door with a label plate (PATCH / ATTACK)
L.reg("sd", "g4-door", (o) => {
